<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teaspoon Deficit (first version)</title>
<style>
:root{
  /* layout: a dark porthole on top, a ledger of stores beneath it, bordered buttons, a black console at the foot */
  --paper:#eceee8; --panel:#f7f8f3; --ink:#17201c; --mute:#5a6860; --rule:#c2cbc3;
  --accent:#0c6a5c; --accent-ink:#ffffff;
  --full:#b05e00; --bad:#b1271f; --good:#1d7a3e; --notion:#2254a3; --whim:#972c83;
  --console:#0a0e0d; --console-ink:#c9dccf; --console-dim:#6f8177;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --paper:#0e1412; --panel:#141c19; --ink:#dde6df; --mute:#8a9990; --rule:#2a3631;
  --accent:#4dc3a9; --accent-ink:#05201a;
  --full:#f0a23a; --bad:#ff7d70; --good:#6fd08c; --notion:#82b2ff; --whim:#e78cd8; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --paper:#0e1412; --panel:#141c19; --ink:#dde6df; --mute:#8a9990; --rule:#2a3631;
  --accent:#4dc3a9; --accent-ink:#05201a;
  --full:#f0a23a; --bad:#ff7d70; --good:#6fd08c; --notion:#82b2ff; --whim:#e78cd8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}

/* the window */
#view{position:relative;flex:none;height:136px;background:#070a10;overflow:hidden;color:#eef2ec}
#sky{display:block;width:100%;height:100%;cursor:crosshair}
#sky.nogl{background:radial-gradient(120% 90% at 50% 120%,#1b2a22 0 38%,transparent 39%),linear-gradient(#05070d,#0d0c1c)}
#view::before{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,#000c);pointer-events:none}
#view>*:not(#sky){position:absolute;text-shadow:0 1px 3px #000,0 0 8px #000}
#ship{top:8px;left:12px;max-width:calc(100% - 170px);font:italic 15px/1.2 var(--serif);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 0}
.hbs{top:8px;right:10px;display:flex;gap:6px}
.hb{font:12px var(--mono);padding:6px 10px;border:1px solid #ffffff55;border-radius:4px;background:#00000066;min-width:58px}
.hud{left:12px;bottom:8px;pointer-events:none}
.hud h1{margin:0 0 2px;font:600 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#a9bdb2}
#count{font:700 28px/1 var(--serif);font-variant-numeric:tabular-nums}
#count-l{font:13px var(--serif);color:#cfd8d1}
.vr{right:12px;bottom:8px;text-align:right;font:11px/1.5 var(--mono);color:#cfd8d1;pointer-events:none;max-width:55%}
#deficit{color:#ffc48a}
#date{top:34px;left:12px;font:11px var(--mono);color:#cfd8d1;pointer-events:none}
.paused #view::after{content:"PAUSED";position:absolute;inset:0;display:grid;place-items:center;background:#000a;font:600 14px var(--mono);letter-spacing:.4em;pointer-events:none}

/* stores */
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#res{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule);background:var(--panel)}
.r{padding:4px 8px 5px;border-right:1px solid var(--rule);border-top:1px solid var(--rule);min-width:0}
.rn{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mute);white-space:nowrap}
.rr{font-family:var(--mono);font-size:10.5px}
.rr[data-s="bad"]{color:var(--bad)}
.rv{font:600 14px/1.25 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc{font-weight:400;font-size:11px;color:var(--mute)}
.r[data-s="full"] .rx{color:var(--full)} .r[data-s="bad"] .rx{color:var(--bad)}
.r-notions .rx{color:var(--notion)} .r-whimsy .rx{color:var(--whim)} .r-cycles .rx{color:var(--good)}

/* tabs and the working area */
#mid{flex:1;min-height:0;display:flex;flex-direction:column}
#tabs{flex:none;display:flex;overflow-x:auto;border-bottom:1px solid var(--rule);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{position:relative;padding:11px 14px 9px;white-space:nowrap;color:var(--mute);border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.dot{position:absolute;top:8px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--full)}
#main{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
#main>*{flex:none}
h2{margin:10px 0 0;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
.lede{font:16px/1.4 var(--serif);text-wrap:pretty;max-width:62ch}
.note{font-size:13px;color:var(--mute);max-width:65ch}
.note.warn{color:var(--bad);font-weight:600}
.hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.hand{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px;min-height:62px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);text-align:left}
.hand.prime{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hand:active,.act:active,.pm:active,.chip:active{transform:translateY(1px)}
.ht{font-weight:600;font-size:15px} .hs{font:11px var(--mono);opacity:.85}
.item{display:grid;grid-template-columns:1fr 46px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);overflow:hidden}
.act{padding:12px;text-align:left;font-size:16px;min-height:46px}
.more{border-left:1px solid var(--rule);font-size:20px;color:var(--mute);transition:transform .15s}
.more.on{transform:rotate(90deg);border-left:0;border-top:1px solid var(--rule)}
.detail{grid-column:1/-1;border-top:1px solid var(--rule);padding:10px 12px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.detail .eff{color:var(--ink)}
.item[data-s="no"]{border-color:var(--rule)} .item[data-s="no"] .act{color:var(--mute)}
.item[data-s="cap"]{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)} .item[data-s="cap"] .act{color:var(--bad)}
.item.hit{animation:hit .25s}
@keyframes hit{from{background:color-mix(in srgb,var(--accent) 30%,var(--panel))}to{background:var(--panel)}}
.costs{display:flex;flex-direction:column;gap:1px;font:12px var(--mono);font-variant-numeric:tabular-nums}
.cost{display:flex;justify-content:space-between;max-width:260px}
.cost[data-s="ok"] .cv{color:var(--good)} .cost[data-s="no"] .cv{color:var(--ink)} .cost[data-s="cap"] .cv{color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.ctl-s{font:11px var(--mono)}
.chip{padding:8px 12px;border:1px solid var(--ink);border-radius:999px;background:var(--panel);font-size:14px;text-align:left}
.chip.wide{border-radius:6px;padding:12px;width:100%} .chip.wide span{color:var(--mute);font-size:13px}
.chip.danger{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{padding:7px 14px;font:13px var(--mono);border-right:1px solid var(--rule)} .seg button:last-child{border:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.job{display:grid;grid-template-columns:1fr 46px 46px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.job.dim{opacity:.45}
.jn{font-size:16px} .jd{font-size:12.5px;color:var(--mute)}
.pm{height:44px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:600 20px var(--mono)}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter.drift i{background:var(--bad)} .meter.acc i{background:var(--whim)}
.card{border:1px solid var(--whim);border-left-width:5px;border-radius:6px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.pt{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--whim)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.link{align-self:flex-start;font-size:13px;color:var(--accent);text-decoration:underline;padding:6px 0;text-align:left}
.done{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.done b{font-family:var(--serif);font-size:15px} .done span{color:var(--mute);max-width:65ch}
.done.dim b{color:var(--mute);font-weight:400}
.census summary{padding:10px 0;font-weight:600;cursor:pointer}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.nm{display:flex;flex-direction:column;text-align:left;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;font-size:13px}
.nm span{font-size:11px;color:var(--mute)} .nm.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.namecand{padding:13px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:italic 16px var(--serif);text-align:left}
.fleet{margin:0;padding-left:18px;font:italic 14px/1.6 var(--serif);color:var(--mute)}
.last{padding:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--serif)}

/* the console */
#logbar{flex:none;display:flex;height:60px;border-top:1px solid var(--rule);background:var(--console);color:var(--console-ink);font:12px/1.4 var(--mono)}
#logbar.tall{height:48%}
#observe{flex:none;width:78px;border-right:1px solid #ffffff22;color:var(--console-dim)}
#observe.live{color:#0a0e0d;background:#ffd27a;font-weight:700;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#fff3c9}}
#log{flex:1;min-width:0;overflow-y:auto;padding:6px 10px;cursor:pointer}
#log p{color:var(--console-dim);padding-left:1.3em;text-indent:-1.3em}
#log p:first-child{color:var(--console-ink);font-weight:600}
#log p.bad{color:#ff9d8f} #log p.good{color:#9fe0b4} #log p.big{color:#ffd27a}

/* overlays */
#toasts{position:fixed;bottom:72px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;padding:0 16px}
.toast{background:var(--console);color:#ffd27a;font:12px/1.4 var(--mono);padding:8px 12px;border-radius:6px;border:1px solid #ffd27a66;max-width:440px;transition:opacity .5s}
.toast.out{opacity:0}
.back{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font:700 22px/1.15 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);text-wrap:balance}
.end-x{font:16px/1.5 var(--serif);text-wrap:pretty}
.code{width:100%;height:110px;font:11px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px;resize:vertical}

@media (max-width:359px){ #res{grid-template-columns:repeat(3,1fr)} }
@media (min-width:900px){
  #view{height:190px}
  #count{font-size:38px}
  #body{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr)}
  #res{display:flex;flex-direction:column;border-bottom:0;border-right:1px solid var(--rule);overflow-y:auto}
  .r{border-right:0;border-top:0;border-bottom:1px solid var(--rule);padding:8px 14px}
  .rv{font-size:16px}
  #main{padding:16px 20px 28px}
  #logbar,#logbar.tall{height:auto;flex-direction:column}
  #toasts{bottom:auto;top:12px}
  #observe{width:auto;height:44px;border-right:0;border-bottom:1px solid #ffffff22}
  #log{cursor:default;padding:10px 12px}
  #log p{margin-bottom:5px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <section id="view" aria-label="The view outside">
    <canvas id="sky"></canvas>
    <button id="ship" type="button" title="Tap to rename your ship"></button>
    <div class="hbs"><button id="pause" class="hb" type="button">Pause</button><button id="menu" class="hb" type="button">Menu</button></div>
    <div class="hud"><h1>The Teaspoon Deficit</h1><div><span id="count">0</span> <span id="count-l">spoons made</span></div></div>
    <div id="date"></div>
    <div class="vr"><div id="deficit" hidden></div></div>
  </section>
  <div id="body">
    <aside id="res" aria-label="Stores"></aside>
    <div id="mid"><nav id="tabs" aria-label="Sections"></nav><main id="main"></main></div>
    <footer id="logbar"><button id="observe" type="button" disabled>Observe</button><div id="log" aria-live="polite"></div></footer>
  </div>
</div>
<div id="toasts"></div>
<script>
(function(){
'use strict';
/* ===== THE TEASPOON DEFICIT: game rules (no DOM in this file) ===== */
const DEFICIT = 7.3e27, DAY = 2, SEASON_LEN = 200;
const SEASONS = [{n:'Perihelion',m:1.5,w:'warm'},{n:'Outswing',m:1,w:''},{n:'Aphelion',m:0.25,w:'cold'},{n:'Inswing',m:1,w:''}];
const rnd = (a,b) => a + Math.random()*(b-a), pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
let M = null;            // meta: survives across runs
let hook = () => {};     // ui feedback: hook('buy'|'fail'|'unlock'|'stamp'|'end')

const NAMEP = [
 [['Technically','Arguably','Broadly','Provisionally','Mostly','Nominally','Reasonably Sure This Is'],['Within Tolerance','Fine','On Schedule','A Ship','Load-Bearing','Accounted For','Somebody Else’s Job']],
 [['The Unanswerable','Thunderous','Last Great','Inevitable','Sovereign','Incandescent','Magnificent And Final'],['Teaspoon','Rounding Error','Inventory','Afterthought','Paperweight','Drawer','Clerical Oversight']],
 [['Sorry About','Please Ignore','Regrettably,','Do Excuse','Awfully Sorry For','We Meant To Mention','Nobody Warned Us About'],['The Noise','The Hull','Last Tuesday','The Smell Of Lichen','All The Spoons','What Happened','The Forks']]];
const shipName = tag => { const t = tag == null ? Math.floor(Math.random()*3) : tag; return {n: pick(NAMEP[t][0]) + ' ' + pick(NAMEP[t][1]), t}; };
const TN1 = ['Mossy','Pip','Dew','Lumen','Burr','Fen','Odo','Quill','Rime','Sorrel','Wick','Nub','Bram','Tansy','Ember','Plum'];
const TN2 = ['Eightlegs','Slowstep','Dampfoot','Underleaf','Longnap','Softclaw','Driftwater','Hullwarm','Crumb','Thimble'];
const JOBS = {
 grazer: {n:'Grazer', d:'Tends lichen. Everyone without another trade grazes. One grazer feeds two or three in fair weather, far fewer in the cold.', req:S=>1},
 scav:   {n:'Scavenger', d:'Pries scrap from the hull for huts and presses.', req:S=>1},
 scholar:{n:'Scholar', d:'Has notions. Needs a Reading nook to keep them in.', req:S=>nb(S,'library')>=1},
 tinker: {n:'Tinker', d:'Fusses over the presses. Each adds 3% to spoon yield.', req:S=>S.done.metallurgy},
 bard:   {n:'Bard', d:'Describes work instead of doing it. Raises accord, leaks whimsy.', req:S=>S.done.philosophy}};
const QK = {
 long:{n:'Long year',d:'Seasons last twice as long.',year:2},
 seam:{n:'Rich seam',d:'Scrap ×2. Lichen grows 30% slower.',scrap:2,lichen:0.7},
 chatty:{n:'Chatty mind',d:'Whimsy ×3. Cycles 30% slower.',whim:3,cyc:0.7},
 dense:{n:'Dense moss',d:'Huts hold three. Everyone eats 25% more.',berth:1,eat:1.25},
 pet:{n:'Bureau favourite',d:'Mandate arrives 40% sooner. Accord settles 10 lower.',mand:0.6,acc:-10},
 alley:{n:'Comet alley',d:'Comets come four times as often.',comet:0.25},
 heavy:{n:'Heavy dies',d:'Each tap stamps ten times as much. Presses run 30% slower.',hand:10,press:0.7},
 friends:{n:'Old friends',d:'Hails recharge twice as fast. Newcomers wake more slowly.',hail:2,arr:0.6}};

const nb = (S,id) => S.b[id] || 0;
const qk = S => QK[S.quirk] || {};
function newMeta(){ return {runs:0, endings:{}, ach:{}, guide:{}}; }
function newState(quirk){
  const hz = {}; for (const k in M.endings) hz[k] = 1;
  const S = {v:1, t:Date.now(), age:0, phase:1, ship:shipName(), renames:0, paused:0,
    r:{lichen:0, scrap:10, spoons:0, notions:0, cycles:0, whimsy:0}, made:0, hand:0,
    b:{}, share:0.5, pop:0, tun:0, tunT:0, arr:0, jobs:{grazer:0,scav:0,scholar:0,tinker:0,bard:0}, crew:[], leader:-1,
    done:{}, seen:{}, mand:0, mp:0, proc:1, mem:1, accord:60, accMod:hz.tea?5:0, fest:0, weather:0, si:0,
    hails:3, traded:{}, pedlar:0, pedT:rnd(400,700), comet:0, cometT:rnd(120,200), comets:0,
    pet:-1, petT:rnd(200,320), petLeft:0, belt:2e11, ladles:0, forks:0, launched:0,
    design:{reach:0,rep:0,stamp:0,shield:0,manners:0,edge:0}, lat:0, bank:0, flux:0,
    taste:Math.floor(Math.random()*3), cand:null, fleet:[], goodNames:0,
    m:{graze:1,bed:1,scav:1,pressSpd:1,yield:1,cap:1,ncap:1,notion:1,cyc:1,mem:1,whim:1,drone:1,foundry:1,hand:1,drift:1,edge:1},
    quirk:quirk||'', heir:hz, log:[], ended:'', fin:0, coldTun:0, sunTaps:0, _sp:0, _used:0};
  if (hz.small) { S.b.hut = 2; S.b.bed = 1; S.seen.lichen = 1; }
  if (hz.books) S.mp += 2;
  return S;
}
function log(S, msg, kind){ S.log.push({a:S.age, m:msg, k:kind||''}); if (S.log.length > 80) S.log.shift(); }
function seasonLen(S){ return SEASON_LEN * (qk(S).year || 1); }
function cal(S){ const sl = seasonLen(S); return {i:Math.floor(S.age/sl)%4, year:Math.floor(S.age/(4*sl)), day:Math.floor((S.age%sl)/DAY)+1, frac:(S.age%(4*sl))/sl}; }
const thr = S => 40 * Math.pow(1.8, S.mand) * (qk(S).mand || 1);

/* ---------- buildings ---------- */
const BLD = {
 bed:{n:'Lichen bed',d:'A scraped patch of hull where lichen takes hold. Grows with the seasons.',c:{lichen:10},k:1.12,e:'+0.25 lichen/s in fair weather',req:S=>S.seen.lichen},
 hut:{n:'Moss hut',d:'Damp, dark and exactly right. Tardigrades wake when there is somewhere to live and something to eat.',c:{scrap:8},k:1.5,e:'+2 berths',req:S=>nb(S,'bed')>=1},
 press:{n:'Stamping press',d:'Stamps spoons from scrap without being asked.',c:{spoons:20},k:1.12,e:'turns 0.5 scrap/s into spoons',req:S=>S.made>=12},
 locker:{n:'Locker',d:'Somewhere to put things, so that there can be more things.',c:{scrap:40},k:1.2,e:'+150 scrap and +1.5K lichen storage',req:S=>nb(S,'hut')>=2},
 library:{n:'Reading nook',d:'A dry corner where scholars keep their notions.',c:{scrap:25},k:1.15,e:'+250 notion storage, scholars +8%',req:S=>S.pop>=2},
 antenna:{n:'Antenna',d:'Bent from spoon handles. Lets you hail passing traffic.',c:{scrap:120,spoons:300},k:1.5,e:'+1 hail, new trading partners',req:S=>S.done.signal},
 rack:{n:'Tun-rack',d:'Bunks, eight legs deep, in the old cutlery hold.',c:{scrap:150,spoons:300},k:1.3,e:'+5 berths',req:S=>S.done.survey},
 obs:{n:'Observatory',d:'A hole with a lens in it. Catches some comets on its own.',c:{scrap:500,spoons:2000},k:1.25,e:'+1K notion storage, +0.15 notions/s',req:S=>S.done.astronomy},
 drone:{n:'Harvester drone',sec:1,d:'Goes out hungry, comes back heavy.',c:{spoons:4000},k:1.1,e:'+20 scrap/s from the belt',req:S=>S.phase>=2},
 foundry:{n:'Foundry',sec:1,d:'A press that has given up on restraint.',c:{spoons:15000},k:1.1,e:'turns 100 scrap/s into spoons',req:S=>S.phase>=2},
 ring:{n:'Ring segment',sec:1,d:'A spinning berth for twenty. The crew call it the big hut.',c:{spoons:5e5,lichen:3000},k:1.3,e:'+20 berths',req:S=>S.done.ringwright},
 archive:{n:'Archive',sec:1,d:'Every notion, indexed. The index is also indexed.',c:{spoons:1e5,notions:1500},k:1.22,e:'+5K notion storage',req:S=>S.done.archives}};
function bcost(S, id, q){ const d = BLD[id], n = nb(S,id), o = {}; const f = Math.pow(d.k,n) * (Math.pow(d.k,q)-1)/(d.k-1); for (const r in d.c) o[r] = d.c[r]*f; return o; }
const canPay = (S,c) => { for (const r in c) if (S.r[r] < c[r] - 1e-9) return false; return true; };
const pay = (S,c) => { for (const r in c) S.r[r] = Math.max(0, S.r[r] - c[r]); };
function capOf(S, c, r){ return r=='lichen'?c.capLichen : r=='scrap'?c.capScrap : r=='notions'?c.capNotions : r=='cycles'?c.capCycles : Infinity; }
function buy(S, id, q){
  if (!BLD[id].req(S)) return 0;
  let got = 0; q = q || 1;
  while (got < q && got < 500) { const c = bcost(S,id,1); if (!canPay(S,c)) break; pay(S,c); S.b[id] = nb(S,id)+1; got++; }
  hook(got ? 'buy' : 'fail'); return got;
}

/* ---------- derived numbers ---------- */
function calc(S){
  const c = {}, m = S.m, q = qk(S), hz = S.heir, pop = S.pop, awake = pop - S.tun;
  c.am = 0.6 + S.accord/150;
  const jf = pop > 0 ? awake/pop*c.am : 0, ld = S.crew[S.leader] ? S.crew[S.leader].tr : '';
  const jb = j => S.jobs[j]*jf*(ld===j?1.15:1);
  c.cal = cal(S);
  c.seasonM = Math.max(0.1, SEASONS[c.cal.i].m + S.weather);
  c.capLichen = (2000 + 1500*nb(S,'locker'))*m.cap;
  c.capScrap = S.phase >= 2 ? Infinity : (100 + 150*nb(S,'locker'))*m.cap;
  c.capNotions = (250 + 250*nb(S,'library') + 1000*nb(S,'obs') + 5000*nb(S,'archive'))*m.ncap;
  c.capCycles = 1000*S.mem*m.mem;
  c.capPop = (2 + (q.berth||0))*nb(S,'hut') + 5*nb(S,'rack') + 20*nb(S,'ring');
  c.capHails = 3 + nb(S,'antenna');
  c.lichenIn = (nb(S,'bed')*0.25*m.bed + jb('grazer')*1.0*m.graze)*c.seasonM*(q.lichen||1)*(hz.small?1.25:1);
  c.bedIn = nb(S,'bed')*0.25*m.bed*c.seasonM*(q.lichen||1)*(hz.small?1.25:1);
  c.eat = awake*0.4*(q.eat||1);
  c.beltF = S.belt > 0 ? 1 : 0.05;
  c.droneIn = nb(S,'drone')*20*m.drone*c.beltF;
  c.scrapIn = jb('scav')*0.25*m.scav*(q.scrap||1)*(hz.forks?1.25:1) + c.droneIn;
  c.demand = nb(S,'press')*0.5*m.pressSpd*(q.press||1) + nb(S,'foundry')*100*m.foundry;
  c.yield = m.yield*(1 + 0.03*jb('tinker'))*(hz.full?1.5:1);
  c.notionsIn = jb('scholar')*0.1*m.notion*(1 + 0.08*nb(S,'library'))*(hz.tea?1.25:1) + nb(S,'obs')*0.15;
  c.cyclesIn = S.seen.mind ? S.proc*4*m.cyc*(q.cyc||1) : 0;
  c.whimsyIn = (S.seen.mind && S.r.cycles >= c.capCycles - 1e-6 ? S.proc*0.012*Math.sqrt(m.cyc)*m.whim*(q.whim||1) : 0) + jb('bard')*0.02*(q.whim||1);
  const bards = pop > 0 ? S.jobs.bard/pop : 0;
  c.accT = clamp(60 + Math.min(25, 250*bards) + (S.fest>0?10:0) + clamp(S.accMod,-30,30) + (q.acc||0) - (S.tun>0?25:0), 5, 100);
  const d = S.design, pts = 8 + S.lat;
  c.free = pts - d.reach - d.rep - d.stamp - d.shield - d.manners - d.edge;
  c.edge = (d.edge + (hz.forks?1:0))*m.edge;
  c.perLadle = d.stamp*4000*Math.pow(1+d.reach,1.5)*(hz.full?1.5:1);
  c.drift = S.ladles + S.forks > 0 ? S.forks/(S.ladles+S.forks) : 0;
  return c;
}

/* ---------- the tick ---------- */
function addSpoons(S, x){
  if (x <= 0) return;
  if (S.phase >= 3 && S.made + x >= DEFICIT) { x = DEFICIT - S.made; if (!S.fin) { S.fin = 1; log(S,'The count stops. The Deficit reads zero.','big'); hook('unlock'); } }
  S.r.spoons += x; S.made += x;
  while (S.made >= thr(S)) { S.mand++; S.mp++; if (S.mand < 40 || S.mand % 5 == 0) log(S,'The Bureau notes your output. Mandate +1.','good'); }
}
function addTardi(S){
  S.pop++; S.jobs.grazer++;
  if (S.crew.length < 40) S.crew.push({n:pick(TN1)+' '+pick(TN2), tr:pick(Object.keys(JOBS))});
  if (S.pop <= 12 || S.pop % 25 == 0) log(S, S.pop==1 ? 'A tardigrade uncurls in the moss hut and starts grazing. You could ask it to do something else.' : (S.crew.length<=40&&S.pop<=40 ? S.crew[S.crew.length-1].n : 'Another tardigrade') + ' has woken up. Crew: ' + S.pop + '.');
}
function tick(S, dt, online){
  if (S.ended && S.ended != 'small' && S.ended != 'tea') return;
  const c = calc(S), r = S.r, q = qk(S);
  const si0 = c.cal.i; S.age += dt;
  /* lichen and tuns */
  r.lichen += (c.lichenIn - c.eat)*dt;
  if (r.lichen <= 0) {
    r.lichen = 0;
    if (c.lichenIn < c.eat && S.pop > 0) {
      const eatFull = S.pop*0.4*(q.eat||1), grazeFull = (c.lichenIn - c.bedIn)*(S.pop/Math.max(1,S.pop-S.tun));
      const f = eatFull > grazeFull ? clamp(c.bedIn/(eatFull-grazeFull),0,1) : 1, target = S.pop - Math.floor(f*S.pop);
      S.tunT += dt; const k = Math.floor(S.tunT/1.5);
      if (k > 0) { S.tunT = 0; if (S.tun < target) { if (!S.tun) log(S,'The lichen has run out. Tardigrades are curling up into tuns to wait.','bad'); S.tun = Math.min(target, S.tun+k); S.coldTun = 1; S.seen.tun = 1; } }
    }
  } else if (S.tun > 0 && r.lichen > S.pop) { S.tunT += dt; const k = Math.floor(S.tunT/1.5); if (k > 0) { S.tunT = 0; S.tun = Math.max(0, S.tun-k); if (!S.tun) log(S,'Everyone is awake again.','good'); } }
  if (r.lichen > c.capLichen) r.lichen = c.capLichen;
  if (r.lichen > 0) S.seen.lichen = 1;
  /* scrap, presses, foundries */
  const inc = c.scrapIn*dt;
  if (S.phase >= 2 && S.belt > 0) S.belt = Math.max(0, S.belt - c.droneIn*dt);
  let avail = S.share >= 1 ? r.scrap + inc : S.share*inc + Math.max(0, r.scrap + (1-S.share)*inc - c.capScrap);
  const used = S.share <= 0 ? 0 : Math.min(c.demand*dt, avail);
  r.scrap = clamp(r.scrap + inc - used, 0, c.capScrap);
  let sp = used*c.yield;
  /* ladles and forks */
  if (S.phase >= 3 && S.ladles > 0 && !S.fin) {
    const d = S.design, L = S.ladles, F = S.forks, acc = 1.5 - S.accord/100, man = 1 + 0.5*d.manners;
    const born = L*(Math.exp(0.0015*d.rep*dt) - 1), lost = L*(1 - Math.exp(-0.0012/(1+d.shield)*dt));
    const nf = born*0.03*acc/man*S.m.drift, mix = L/(L+F);
    const conv = Math.min(L*0.5, F*(0.006/(1+c.edge))*acc/man*S.m.drift*mix*dt), kill = Math.min(F, F*0.0015*c.edge*mix*dt);
    S.ladles = Math.max(0, L + born - lost - nf - conv); S.forks = Math.max(0, F + nf + conv - kill);
    if (S.ladles < 0.5) { S.ladles = 0; if (S.forks >= 1) log(S,'Your last ladle has grown tines. Launch more, with better manners or a sharper edge.','bad'); }
    sp += L*c.perLadle*dt;
    if (S.forks > 1000 && S.forks > 9*S.ladles) return endRun(S,'forks');
  }
  addSpoons(S, sp); S._sp = sp/dt; S._used = used/dt;
  /* thought */
  r.notions = Math.min(c.capNotions, r.notions + c.notionsIn*dt);
  r.cycles = Math.min(c.capCycles, r.cycles + c.cyclesIn*dt);
  r.whimsy += c.whimsyIn*dt;
  /* arrivals */
  if (S.pop < c.capPop && r.lichen > 0 && S.tun == 0) {
    S.arr += dt/12*(1 + c.capPop/25)*(S.fest>0?2:1)*(q.arr||1);
    while (S.arr >= 1 && S.pop < c.capPop) { S.arr--; addTardi(S); }
  } else S.arr = 0;
  /* mood, hails, timers */
  S.accord += clamp(c.accT - S.accord, -0.2*dt, 0.2*dt);
  if (S.fest > 0) S.fest = Math.max(0, S.fest - dt);
  if (S.hails < c.capHails) S.hails = Math.min(c.capHails, S.hails + dt/60*(q.hail||1));
  const si = cal(S).i;
  if (si != si0) {
    S.weather = Math.random() < 0.3 ? 0.15 : Math.random() < 0.43 ? -0.1 : 0;
    if (si0 == 2) { if (!S.coldTun && S.pop >= 5) ach('warm'); S.coldTun = 0; }
    if (si == 2) S.seen.aph = 1;
    log(S, SEASONS[si].n + ' begins' + (si==2?'. The lichen slows to a quarter. Mind the stores.':si==0?'. Warm light on the hull. The lichen races.':'.'), si==2?'bad':'');
  }
  if (online) {
    if (S.comet > 0) { S.comet -= dt; if (S.comet <= 0 && Math.random() < 0.25*nb(S,'obs')) observe(S, 1); }
    else if (S.pop >= 1 && (S.cometT -= dt) <= 0) { S.comet = 22; S.cometT = rnd(170,330)*(q.comet||1); log(S,'A comet is crossing the sky. Tap Observe.','big'); hook('unlock'); }
    if (S.done.philosophy && S.pet < 0 && (S.petT -= dt) <= 0) { S.pet = Math.floor(Math.random()*PET.length); S.petLeft = 300; log(S,'The crew have a petition for you. (Crew)','big'); hook('unlock'); }
    if (S.pet >= 0 && (S.petLeft -= dt) <= 0) { S.pet = -1; S.petT = rnd(240,420); S.accMod -= 1; log(S,'The petition went unanswered. The crew noticed.','bad'); }
    if (nb(S,'antenna') >= 1) {
      if (S.pedlar > 0) S.pedlar -= dt;
      else if ((S.pedT -= dt) <= 0 || new Date().getDay() == 2) { S.pedlar = 180; S.pedT = rnd(500,900); if (!S.seen.ped) log(S,'A small crooked ship is hailing you. It says its name is Odd Tuesday. (Trade)','big'); S.seen.ped = 1; }
    }
  }
}

/* ---------- player actions ---------- */
const handMult = S => S.m.hand*(qk(S).hand||1);
function stamp(S){
  if (S.fin) { return endRun(S,'full'); }
  if (S.r.scrap < 1) { hook('fail'); return 0; }
  const n = Math.min(S.r.scrap, handMult(S)); S.r.scrap -= n; addSpoons(S, n*calc(S).yield); S.hand += n; hook('stamp'); return 1;
}
function pry(S){ const c = calc(S); S.r.scrap = Math.min(c.capScrap, S.r.scrap + Math.max(handMult(S), c.scrapIn*2)); S.seen.pry = 1; hook('tap'); }
function scrape(S){ const c = calc(S); S.r.lichen = Math.min(c.capLichen, S.r.lichen + Math.max(handMult(S), c.lichenIn*2)); S.seen.lichen = 1; hook('tap'); }
function setJob(S, j, d){
  d = d > 0 ? Math.min(d, S.jobs.grazer) : -Math.min(-d, S.jobs[j]);
  if (!d || j == 'grazer') return hook('fail');
  S.jobs[j] += d; S.jobs.grazer -= d; hook('tap');
}
function alloc(S, k){ if (S.mp < 1) return hook('fail'); S.mp--; S[k]++; hook('buy'); }
function reshuffle(S){ if (S.proc + S.mem <= 2) return hook('fail'); S.mp += S.proc - 1 + S.mem - 1; S.proc = 1; S.mem = 1; S.r.cycles = 0; hook('tap'); }
function festival(S){ const c = {lichen:200 + 40*S.pop, spoons:100 + 20*S.pop}; if (S.fest > 0 || !canPay(S,c)) return hook('fail'); pay(S,c); S.fest = 400; S.seen.fest = 1; log(S,'A Brew-up! Warm water with lichen in it. The crew are delighted.','good'); if (cal(S).i == 2) ach('wake'); hook('buy'); }
const festCost = S => ({lichen:200 + 40*S.pop, spoons:100 + 20*S.pop});
function observe(S, auto){
  if (S.comet <= 0) return hook('fail');
  const c = calc(S), g = 20 + 0.12*c.capNotions; S.comet = 0; S.comets++; S.r.notions = Math.min(c.capNotions, S.r.notions + g); S.r.whimsy += S.seen.mind ? 1 : 0;
  log(S, (auto ? 'The observatory caught the comet' : 'You watch the comet with the scholars') + '. +' + Math.round(g) + ' notions.','good'); if (!auto) hook('buy');
  if (S.comets >= 10) ach('comets'); if (S.comets >= 5) marg('m1');
}
function tradeCost(S){ return Math.max(100, Math.round(S._sp*30)); }
function trade(S, id){
  const c = calc(S), cost = {spoons:tradeCost(S)};
  if (S.hails < 1 || !canPay(S,cost)) return hook('fail');
  pay(S,cost); S.hails--; S.traded[id] = 1; let msg;
  if (id == 'choir') { const g = S.phase >= 2 ? c.scrapIn*300 : c.capScrap*rnd(0.25,0.45)*(c.cal.i==2?1.5:1); S.r.scrap = Math.min(c.capScrap, S.r.scrap + g); msg = 'The Gravel Choir eat your spoons, humming. They leave ' + fmt(g) + ' scrap.'; }
  if (id == 'bloom') { const g = c.capLichen*rnd(0.25,0.4); S.r.lichen = Math.min(c.capLichen, S.r.lichen+g); msg = 'The Slow Bloom sheds ' + fmt(g) + ' lichen across your hull.'; if (Math.random() < 0.15) { S.b.bed = nb(S,'bed')+1; msg += ' Some of it takes root: +1 Lichen bed.'; } }
  if (id == 'quorate') { const g = c.capNotions*rnd(0.15,0.25); S.r.notions = Math.min(c.capNotions, S.r.notions+g); msg = 'The Quorate send ' + fmt(g) + ' notions’ worth of footnotes.'; }
  log(S, msg, 'good'); hook('buy');
  if (S.traded.choir && S.traded.bloom && S.traded.quorate) ach('trader');
}
function pedlarBuy(S, what){
  if (S.pedlar <= 0) return hook('fail');
  if (what == 'antique') { if (M.guide.m3 || S.r.spoons < 1000) return hook('fail'); S.r.spoons -= 1000; marg('m3'); log(S,'Odd Tuesday hands over an antique spoon. “Mind the nick,” it says.','big'); }
  else { if (S.r.whimsy < 20) return hook('fail'); S.r.whimsy -= 20; const left = GUIDE.filter(g => !M.guide[g.id] && g.id[0] != 'm' && g.id != 'loop' && g.ped); if (left.length) { M.guide[left[0].id] = 1; log(S,'A loose page for the Margin: “' + left[0].t + '”.','good'); } else { S.r.notions += 50; log(S,'The page is blank. You have notions about that.',''); } }
  ach('tuesday'); hook('buy');
}
function nameSession(S){ if (S.r.cycles < 500) return hook('fail'); S.r.cycles -= 500; S.cand = [0,1,2].sort(() => Math.random()-0.5).map(t => shipName(t)); hook('buy'); }
function nameChoose(S, i){
  const nm = S.cand[i]; if (!nm) return; const hit = nm.t == S.taste, g = (hit ? 20 : 5)*(1 + S.proc/10);
  S.r.whimsy += g; S.cand = null; S.fleet.unshift(nm.n); S.fleet.length = Math.min(S.fleet.length, 8); S.seen.named = 1;
  if (hit) { S.goodNames++; if (S.goodNames >= 10) ach('patron'); }
  log(S, '“' + nm.n + '”. ' + (hit ? 'The crew ripple with approval.' : 'The crew are polite about it.') + ' +' + Math.round(g) + ' whimsy.', hit?'good':''); hook('buy');
}
function rename(S){ S.ship = shipName(); S.renames++; if (S.renames >= 7) ach('indecisive'); hook('tap'); }
function cycleShare(S){ S.share = S.share >= 1 ? 0 : S.share > 0 ? 1 : 0.5; hook('tap'); }
function redesign(S, k, d){ const c = calc(S); if ((d > 0 && c.free < 1) || (d < 0 && S.design[k] < 1) || (k=='manners' && !S.done.etiquette)) return hook('fail'); S.design[k] += d; hook('tap'); }
const latCost = S => ({whimsy:100*Math.pow(1.2,S.lat)});
function latitude(S){ const c = latCost(S); if (S.lat >= 20 || !canPay(S,c)) return hook('fail'); pay(S,c); S.lat++; hook('buy'); }
function launch(S, q){ let n = 0; while (n < q && S.r.spoons >= 1e8) { S.r.spoons -= 1e8; S.ladles++; S.launched++; n++; } hook(n ? 'buy' : 'fail'); if (n && S.launched == n) log(S,'The first ladle clears the hull. It is already thinking about a second ladle.','big'); }
function petition(S, ch){ const p = PET[S.pet]; if (!p) return; const o = ch ? p.b : p.a; o[1](S); log(S, o[2], ''); S.pet = -1; S.petT = rnd(240,420); hook('buy'); }
function setLeader(S, i){ S.leader = S.leader == i ? -1 : i; hook('tap'); }

/* run once a second: unlocks, notes, records */
function checks(S){
  const c = calc(S);
  if (!S.seen.pb && (S.made >= 3 || S.r.scrap < 1)) { S.seen.pb = 1; log(S,'The tray is nearly empty. There is plenty more hull where that came from.',''); }
  if (!S.seen.lb && S.made >= 8) { S.seen.lb = 1; log(S,'Something small is watching you from the lichen.','big'); }
  if (S.pop >= 1) S.seen.crew = 1;
  if (S.mand >= 1 && !S.seen.mind) { S.seen.mind = 1; log(S,'A relay crackles. The Bureau of Cutlery Equilibrium has noticed you. You have a Mandate. (Mind)','big'); hook('unlock'); }
  if (S.forks >= 1) S.seen.forks = 1;
  if (S.made >= 1) ach('first'); if (S.hand >= 1000) ach('artisan'); if (S.pop >= 50) ach('pop50'); if (S.pop >= 200) ach('pop200');
  if (S.made >= 1e9) ach('billion'); if (S.launched >= 1) ach('phase3'); if (S.bank >= 3600) ach('teabreak');
  if (S.hand >= 500) marg('m2'); if (c.cal.year >= 6) marg('m4');
  if (S.design.reach >= 6 && S.ladles >= 1e6) marg('m6');
  if (Object.keys(M.endings).length >= 1 && S.done.chronology) marg('m7');
  let n = 0;
  for (const g of GUIDE) { if (!M.guide[g.id] && g.c && g.c(S)) { M.guide[g.id] = 1; if (S.done.manual) log(S,'New in the Margin: ' + g.t + '.',''); } if (M.guide[g.id]) n++; }
  if (n >= GUIDE.length) ach('librarian');
  const f = c.drift;
  if (S.phase >= 3 && S.forks > 100) { const lv = f > 0.6 ? 3 : f > 0.35 ? 2 : f > 0.15 ? 1 : 0; if (lv > (S.warned||0)) log(S, ['','Drift warning: some ladles have grown tines.','Drift is spreading. A third of the fleet are Forks.','The Forks outnumber you. Redesign, or lose the argument.'][lv],'bad'); S.warned = lv; }
}

/* ---------- numbers ---------- */
const UNITS = ['','K','M','G','T','P','E','Z','Y'];
function fmt(x){
  if (!isFinite(x)) return '∞'; if (x < 0) return '−' + fmt(-x);
  if (x < 1000) return x >= 100 || x % 1 === 0 ? String(Math.floor(x)) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
  const e = Math.min(8, Math.floor(Math.log10(x)/3)), v = x/Math.pow(1000,e);
  return (e == 8 && v >= 1000 ? v.toExponential(2) : v >= 100 ? v.toFixed(1) : v.toFixed(2)) + UNITS[e];
}
const BIG = ['','thousand','million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion'];
function fmtLong(x){ if (x < 1e9) return Math.floor(x).toLocaleString('en-GB'); const e = Math.min(9, Math.floor(Math.log10(x)/3)); return (x/Math.pow(1000,e)).toFixed(2) + ' ' + BIG[e]; }
function fmtTime(s){ s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + (s%60) + 's' : s + 's'; }
/* catch-up for time spent away */
function simulate(S, el){ const steps = Math.min(4000, Math.ceil(el/0.5)), dt = el/steps; for (let i = 0; i < steps; i++) tick(S, dt, false); checks(S); }


/* ===== the window: one fragment shader draws the sky, the hull, the belt and the fleet ===== */
const FRAG = `
precision mediump float;
uniform vec2 R; uniform float T, SEA, WARM, BEDS, POP, PH, COM, DRIFT, PULSE, TUN, GOLD, FLEET, BELT;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
float stars(vec2 uv, float sc, float th){ vec2 g=floor(uv*sc), f=fract(uv*sc)-.5; float r=h(g);
  vec2 o=vec2(h(g+3.1),h(g+7.7))-.5; float d=length(f-o*.6);
  return step(th,r)*smoothstep(.10,.0,d)*(.6+.4*sin(T*(1.+r*3.)+r*40.)); }
void main(){
  vec2 uv=gl_FragCoord.xy/R; float asp=R.x/R.y; vec2 p=vec2((uv.x-.5)*asp, uv.y);
  vec3 col=mix(vec3(.020,.030,.055), vec3(.045,.040,.095), uv.y);
  float nb=fbm(p*1.6+vec2(T*.004,0.));

const Sky = {
  ok: false, u: {}, t0: performance.now(),
  init(cv) {
    this.cv = cv;
    try {
      const gl = this.gl = cv.getContext('webgl', {antialias:false, alpha:false, powerPreference:'low-power'}) || cv.getContext('experimental-webgl');
      if (!gl) return;
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
      const a = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      for (const k of ['R','T','SEA','WARM','BEDS','POP','PH','COM','DRIFT','PULSE','TUN','GOLD','FLEET','BELT']) this.u[k] = gl.getUniformLocation(pr, k);
      this.ok = true;
    } catch (e) { this.ok = false; cv.classList.add('nogl'); }
  },
  draw(v) {
    if (!this.ok) return;
    const gl = this.gl, cv = this.cv, dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(2, Math.round(cv.clientWidth*dpr)), hgt = Math.max(2, Math.round(cv.clientHeight*dpr));
    if (cv.width != w || cv.height != hgt) { cv.width = w; cv.height = hgt; }
    gl.viewport(0, 0, w, hgt);
    gl.uniform2f(this.u.R, w, hgt); gl.uniform1f(this.u.T, (performance.now() - this.t0)/1000);

  },
  /* where the sun is, in 0..1 canvas coordinates, for people who cannot resist tapping it */
  sun(sea) { const asp = this.cv.clientWidth/Math.max(1,this.cv.clientHeight), a = sea/4*6.2832; return {x: 0.5 + (-Math.sin(a)*0.36*asp)/asp, y: 1 - (0.74 + 0.13*Math.cos(a))}; }
};

const setT = (el, t) => { if (el._t !== t) { el._t = t; el.textContent = t; } };
const setD = (el, k, v) => { if (el.dataset[k] !== v) el.dataset[k] = v; };
const fmt3 = x => { if (!isFinite(x)) return '\u221e'; if (x < 0) return '\u2212' + fmt3(-x); if (x < 1000) return x >= 100 || x % 1 === 0 ? String(Math.floor(x)) : x >= 10 ? x.toFixed(1) : x.toFixed(2); const e = Math.min(8, Math.floor(Math.log10(x)/3)), v = x/Math.pow(1000,e); return (v >= 1000 ? v.toExponential(1) : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + UNITS[e]; };
const qn = () => buyQ == 'max' ? 500 : buyQ;

function costState(c){ let st = ''; for (const r in c) if (S.r[r] < c[r] - 1e-9) { if (c[r] > capOf(S,C,r)) return 'cap'; st = 'no'; } return st; }
function costEl(fn){
  const box = h('div','costs'), rows = {};
  U(() => { const c = fn(); for (const r in c) { let row = rows[r]; if (!row) { row = rows[r] = h('div','cost'); row.append(h('span','cn',r), h('span','cv')); box.append(row); }
    setT(row.lastChild, fmt(Math.min(S.r[r], c[r])) + ' / ' + fmt(c[r])); setD(row, 's', S.r[r] >= c[r] - 1e-9 ? 'ok' : c[r] > capOf(S,C,r) ? 'cap' : 'no'); } });

function item(key, o){
  const w = h('div','item'), a = btn('act'), m = btn('more','›'), d = h('div','detail');

  const sync = () => { d.hidden = !openK[key]; m.classList.toggle('on', !!openK[key]); m.setAttribute('aria-expanded', !!openK[key]); };

}
const head = (el, t) => el.append(h('h2','', t));

function meter(el, fn, cls){ const m = h('div','meter ' + (cls||'')), f = h('i'); m.append(f); U(() => { const v = clamp(fn(),0,1); const w = (v*100).toFixed(1) + '%'; if (f._w !== w) { f._w = w; f.style.width = w; } }); el.append(m); return m; }

const STATS = {rep:['Replication','Ladles that build ladles. Sets how fast the fleet doubles.'], stamp:['Stamping','Spoons per ladle. At zero, a ladle makes nothing at all.'], reach:['Reach','How far they roam. More matter, more spoons each.'], shield:['Shielding','Fewer ladles lost to rocks, stars and boredom.'], edge:['Edge','Ladles convert less easily and can retire Forks.'], manners:['Manners','Fewer ladles drift. Needs Etiquette.']};
SIG.ladles = () => [S.done.etiquette, S.fin].join('|');
R.ladles = el => {
  note(el, () => 'Deficit remaining: ' + fmtLong(Math.max(0, DEFICIT - S.made)) + ' spoons').className = 'lede';
  meter(el, () => Math.log10(Math.max(1,S.made))/Math.log10(DEFICIT));
  note(el, () => 'Ladles ' + fmt(Math.floor(S.ladles)) + ' · Forks ' + fmt(Math.floor(S.forks)) + ' · each ladle stamps ' + fmt(C.perLadle) + '/s');
  note(el, () => { const d = S.design, g = 0.0015*d.rep - 0.0012/(1+d.shield); return S.ladles < 1 ? 'No ladles flying. Set a design, then launch.' : g > 0 ? 'The fleet doubles about every ' + fmtTime(Math.log(2)/g) + ', before Forks.' : 'The fleet is shrinking. Add Replication or Shielding.'; });
  const dn = note(el, () => 'Drift: ' + (C.drift*100).toFixed(1) + '% of the fleet are Forks'); meter(el, () => C.drift, 'drift'); U(() => dn.classList.toggle('warn', C.drift > 0.15));
  buyMode(el);
  el.append(item('launch', {title:() => 'Launch a ladle', act:() => launch(S, qn()), cost:() => ({spoons:1e8}), desc:'One is enough to start. They make more of themselves.'}));
  head(el, 'Design'); note(el, () => C.free + ' of ' + (8 + S.lat) + ' points free. Redesign whenever you like; the fleet obeys at once.');
  for (const k in STATS) { const w = h('div','job'), nm = h('div','jn'), left = h('div','jl'); left.append(nm, h('div','jd', STATS[k][1])); w.append(left, btn('pm','−', act(() => redesign(S,k,-1))), btn('pm','+', act(() => redesign(S,k,1))));
    U(() => { setT(nm, STATS[k][0] + ' ' + S.design[k] + (k == 'edge' && S.heir.forks ? ' (+1)' : '')); w.classList.toggle('dim', k == 'manners' && !S.done.etiquette); }); el.append(w); }
  el.append(item('lat', {title:() => S.lat >= 20 ? 'Latitude (as wide as it goes)' : 'Argue for more latitude (' + S.lat + ')', act:() => latitude(S), cost:() => latCost(S), state:() => S.lat >= 20 ? 'no' : costState(latCost(S)), desc:'One more design point. The Bureau is persuaded by whimsy, which says a lot about the Bureau.'}));
};

SIG.time = () => margCount() + '|' + S.flux;
R.time = el => {
  note(el, () => 'Year ' + C.cal.year + ', ' + SEASONS[C.cal.i].n + ', day ' + C.cal.day + ' · this hull has been awake for ' + fmtTime(S.age)).className = 'lede';
  note(el, () => 'Next: ' + SEASONS[(C.cal.i+1)%4].n + ' in ' + fmtTime(seasonLen(S) - S.age % seasonLen(S)) + (S.weather > 0 ? ' · a flare is feeding the lichen' : S.weather < 0 ? ' · dust is dimming the light' : ''));
  head(el, 'Banked time');
  note(el, () => fmtTime(S.bank) + ' banked (three hours at most). Time banks while you are paused or away, a second for every three.');
  el.append(item('flux', {title:() => S.flux ? 'Stop spending banked time' : 'Spend banked time (hull runs ×4)', act:() => { S.flux = S.flux ? 0 : 1; }, state:() => S.bank > 1 || S.flux ? '' : 'no', desc:'While this is on, everything aboard runs four times as fast until the bank is empty.'}));
  head(el, 'Anomalies');
  el.append(h('p','note','The scholars keep a list of things that are in the wrong order. ' + margCount() + ' of 7 found.' + (M.runs ? '' : ' Some of these will take more than one life to find.')));
  MARGS.forEach((k,i) => { const g = GUIDE.find(x => x.id == k), d = h('div','done' + (M.guide[k] ? '' : ' dim')); d.append(h('b','', M.guide[k] ? g.t : 'Unfound'), h('span','', M.guide[k] ? g.x : MARG_HINT[i])); el.append(d); });
};

SIG.margin = () => GUIDE.filter(g => M.guide[g.id]).length + '';
R.margin = el => {
  const n = GUIDE.filter(g => M.guide[g.id]).length;
  el.append(h('p','lede','Your manual, and what somebody wrote in its margins. ' + n + ' of ' + GUIDE.length + ' entries.'));
  GUIDE.forEach(g => { const d = h('div','done' + (M.guide[g.id] ? '' : ' dim')); d.append(h('b','', M.guide[g.id] ? g.t : '· · ·'), h('span','', M.guide[g.id] ? g.x : '')); el.append(d); });
};

SIG.rec = () => [Object.keys(M.ach).length, Object.keys(M.endings).length, S.quirk, S.ended].join('|');
R.rec = el => {
  note(el, () => 'Life ' + (M.runs + 1) + ' · awake ' + fmtTime(S.age) + ' · ' + fmtLong(S.made) + ' spoons made · ' + fmt(S.hand) + ' scrap stamped by hand').className = 'lede';
  if (S.quirk) el.append(h('p','note','This life’s quirk: ' + QK[S.quirk].n + '. ' + QK[S.quirk].d));
  head(el, 'Endings (' + Object.keys(M.endings).length + ' of 5)');
  for (const k in ENDS) { const got = M.endings[k], d = h('div','done' + (got ? '' : ' dim')); d.append(h('b','', got ? ENDS[k].t : 'Not yet reached'), h('span','', got ? ENDS[k].h : ACH['end_'+k][1])); el.append(d); }
  head(el, 'Records (' + Object.keys(M.ach).length + ' of ' + Object.keys(ACH).length + ')');
  for (const k in ACH) { if (k.startsWith('end_')) continue; const got = M.ach[k], d = h('div','done' + (got ? '' : ' dim')); d.append(h('b','', got ? ACH[k][0] : '? ? ?'), h('span','', got ? ACH[k][1] : '')); el.append(d); }
  if (S.ended) el.append(btn('chip','Begin a new life', beginAgain));
};

/* ---------- fixed chrome: header, window, resources, log ---------- */
const RES = [
 ['lichen',() => 1,() => C.lichenIn - C.eat,() => C.capLichen],
 ['scrap',() => 1,() => C.scrapIn - S._used,() => C.capScrap],
 ['spoons',() => S.made >= 1,() => S._sp,null],
 ['notions',() => nb(S,'library') >= 1,() => C.notionsIn,() => C.capNotions],
 ['cycles',() => S.seen.mind,() => C.cyclesIn,() => C.capCycles],
 ['whimsy',() => S.r.whimsy >= 0.5 || S.done.apology,() => C.whimsyIn,null]];
function buildChrome(){
  const res = $('res'); res.replaceChildren(); fixed = [];
  RES.forEach(([r, show, rate, cap]) => { const w = h('div','r r-' + r), top = h('div','rn'), v = h('div','rv'), rt = h('span','rr'), cp = h('span','rc'); top.append(h('span','',r), rt); v.append(h('span','rx'), cp); w.append(top, v); res.append(w);
    fixed.push(() => { const vis = !!show(); if (w.hidden === vis) w.hidden = !vis; if (!vis) return; const x = S.r[r], c = cap ? cap() : Infinity, d = rate();
      setT(v.firstChild, fmt3(x)); setT(cp, isFinite(c) ? '/' + fmt3(c).replace(/\.0+(?=[A-Z]|$)/, '') : ''); setT(rt, Math.abs(d) < 0.005 ? '' : (d > 0 ? '+' : '') + fmt3(d));
      setD(w, 's', isFinite(c) && x >= c*0.995 ? 'full' : x <= 0 && d < 0 ? 'bad' : ''); setD(rt, 's', d < 0 ? 'bad' : ''); }); });
  const crew = h('div','r'), ct = h('div','rn'), cv = h('div','rv'); ct.append(h('span','','crew'), h('span','rr')); cv.append(h('span','rx'), h('span','rc')); crew.append(ct, cv); res.append(crew);
  fixed.push(() => { const vis = S.pop > 0 || C.capPop > 0; if (crew.hidden === vis) crew.hidden = !vis; setT(cv.firstChild, String(S.pop)); setT(cv.lastChild, '/' + C.capPop); setT(ct.lastChild, S.tun ? S.tun + ' tun' : S.done.philosophy ? 'acc ' + Math.round(S.accord) + '%' : ''); setD(ct.lastChild, 's', S.tun ? 'bad' : ''); });
  $('ship').onclick = () => { if (S.ended) return; rename(S); checks(S); frameUI(); };
  $('pause').onclick = () => setPause(!S.paused);
  $('menu').onclick = showMenu;
  $('observe').onclick = act(() => observe(S));
  $('log').onclick = () => $('logbar').classList.toggle('tall');
  $('sky').onclick = e => { const r = $('sky').getBoundingClientRect(), x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
    if (S.comet > 0) return act(() => observe(S))();
    const s = Sky.sun(C.cal.frac); if (Math.hypot((x - s.x)*r.width, (y - s.y)*r.height) < 30) { S.sunTaps++; if (S.sunTaps == 3) log(S,'Please do not tap the sun.',''); if (S.sunTaps == 10) { log(S,'The sun has now been tapped ten times. It is fine. You are the one who has to live with yourself.',''); ach('sun'); } frameUI(); } };
}
function drawTabs(){
  const nav = $('tabs'); nav.replaceChildren();
  TABS.filter(t => t.show()).forEach(t => { const b = btn(t.id == cur ? 'on' : '', t.n, () => { cur = t.id; S.seen['v_'+t.id] = 1; tabSig = ''; frameUI(); main.scrollTop = 0; }); if (t.badge() || (!S.seen['v_'+t.id] && t.id != 'hull')) b.append(h('i','dot')); b.id = 'tab-' + t.id; nav.append(b); });
}
function drawTop(){
  for (const f of fixed) f();
  setT($('ship'), S.ship.n);
  const cl = C.cal, sn = SEASONS[cl.i];
  setT($('date'), S.done.calendar ? 'Year ' + cl.year + ' · ' + sn.n + (sn.w ? ' (' + sn.w + ')' : '') + ', day ' + cl.day : 'Day ' + (Math.floor(S.age/DAY) + 1) + (S.seen.aph || cl.i ? ' · ' + sn.n : ''));
  setT($('count'), fmtLong(S.made)); setT($('count-l'), S.made == 1 ? 'spoon made' : 'spoons made');
  const df = $('deficit'); if (df.hidden === !!S.done.smallprint) df.hidden = !S.done.smallprint; if (S.done.smallprint) setT(df, 'Deficit ' + fmtLong(Math.max(0, DEFICIT - S.made)));
  setT($('pause'), S.paused ? 'Resume' : S.flux && S.bank > 0 ? '×4' : 'Pause'); $('app').classList.toggle('paused', !!S.paused);
  const ob = $('observe'); ob.disabled = !(S.comet > 0); ob.classList.toggle('live', S.comet > 0);
  const last = S.log[S.log.length - 1];
  if (last !== logSeen) { logSeen = last; const box = $('log'); box.replaceChildren(); for (let i = S.log.length - 1; i >= Math.max(0, S.log.length - 40); i--) { const e = S.log[i], p = h('p', e.k); p.textContent = (i == S.log.length - 1 ? '> ' : '. ') + e.m; box.append(p); } box.scrollTop = 0; }
}
function frameUI(){
  C = calc(S);
  if (!TABS.find(t => t.id == cur).show()) cur = 'hull';
  const ts = cur + TABS.filter(t => t.show()).map(t => t.id + (t.badge() ? '*' : '') + (S.seen['v_'+t.id] ? '' : '!')).join();
  if (ts != tabSig) { tabSig = ts; drawTabs(); }
  const s2 = cur + '#' + SIG[cur]();
  if (s2 != sig) { const keep = sig.split('#')[0] == cur ? main.scrollTop : 0; sig = s2; ups = []; main.replaceChildren(); R[cur](main); main.scrollTop = keep; }
  else for (const f of ups) f();
  drawTop();
  if (needEnd) { needEnd = false; showEnd(); }
}

/* ---------- toasts, sound, sheets ---------- */
function toast(msg){ const t = h('div','toast',msg); $('toasts').append(t); setTimeout(() => t.classList.add('out'), 4200); setTimeout(() => t.remove(), 4800); }
let AC = null;
function beep(f, d, v, type){ if (!opt.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type || 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); } catch (e) {} }
hook = (k, x) => {
  if (k == 'stamp') { pulseV = 1; beep(880, 0.06, 0.04, 'square'); }
  else if (k == 'tap') beep(330, 0.05, 0.03);
  else if (k == 'buy') beep(520, 0.09, 0.04);
  else if (k == 'fail') beep(140, 0.08, 0.03, 'sawtooth');
  else if (k == 'unlock') { beep(660, 0.12, 0.04); setTimeout(() => beep(990, 0.18, 0.04), 110); }
  else if (k == 'ach') { toast('Record: ' + x); beep(784, 0.25, 0.04); }
  else if (k == 'end') needEnd = true;
};
function sheet(build, lock){
  const back = h('div','back'), box = h('div','sheet'); back.append(box); const close = () => back.remove();
  if (!lock) back.onclick = e => { if (e.target == back) close(); };
  build(box, close); document.body.append(back); const f = box.querySelector('button'); if (f) f.focus(); return close;
}
function showMenu(){
  sheet((el, close) => {
    el.append(h('h2','','The Teaspoon Deficit'), h('p','note','You are a derelict ship. Stamp spoons, wake the crew, see what opens up. The game saves itself and keeps working while you are away. Pause banks time instead.'));
    const row = (t, fn) => { const b = btn('chip wide', t, fn); el.append(b); return b; };
    row(S.paused ? 'Resume' : 'Pause', () => { setPause(!S.paused); close(); });
    row('Save now', () => { save(true); toast('Saved.'); close(); });
    const sb = row('', () => { opt.sound = opt.sound ? 0 : 1; saveOpt(); sb.textContent = 'Sound: ' + (opt.sound ? 'on' : 'off'); beep(660, 0.1, 0.04); }); sb.textContent = 'Sound: ' + (opt.sound ? 'on' : 'off');
    const cb = row('', () => { opt.calm = opt.calm ? 0 : 1; saveOpt(); cb.textContent = 'Window: ' + (opt.calm ? 'still' : 'moving'); }); cb.textContent = 'Window: ' + (opt.calm ? 'still' : 'moving');
    row('Copy or load a save code', () => { close(); showCode(); });
    if (S.ended) row('Begin a new life', () => { close(); beginAgain(); });
    let armed = 0; const wb = row('Erase everything and start over', () => { if (!armed) { armed = 1; wb.textContent = 'Tap again to erase every life and record'; wb.classList.add('danger'); return; } M = newMeta(); S = null; newRun(''); close(); });
    row('Close', close);
  });
}
function showCode(){
  sheet((el, close) => {
    el.append(h('h2','','Save code'), h('p','note','Copy this somewhere safe, or paste a code from another device and load it.'));
    const ta = h('textarea','code'); ta.id = 'savecode'; ta.value = btoa(unescape(encodeURIComponent(JSON.stringify({S, M})))); ta.setAttribute('aria-label','Save code'); el.append(ta);
    const msg = h('p','note','');
    el.append(btn('chip wide','Copy', () => { ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Copied.'; }, () => { msg.textContent = 'Select the text and copy it by hand.'; }); } catch (e) { msg.textContent = 'Select the text and copy it by hand.'; } }),
      btn('chip wide','Load the code in the box', () => { try { const o = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if (!o.S || !o.S.r || !o.M) throw 0; adopt(o); close(); toast('Save loaded.'); } catch (e) { msg.textContent = 'That code does not look like a save. Check you pasted all of it.'; } }),
      msg, btn('chip wide','Close', close));
  });
}
function showEnd(){
  const e = ENDS[S.ended]; if (!e) return; save(true);
  sheet((el, close) => {
    el.append(h('p','pt','An ending'), h('h2','end-t',e.t), h('p','end-x',e.x), h('p','note', e.h + ' It applies to every life after this one.'),
      h('p','note','Awake ' + fmtTime(S.age) + ' · ' + fmtLong(S.made) + ' spoons · ' + S.pop + ' tardigrades · endings found: ' + Object.keys(M.endings).length + ' of 5'));
    el.append(btn('chip wide','Begin a new life', () => { close(); beginAgain(); }));
    if (e.go) el.append(btn('chip wide','Stay a while and look around', close));
  }, true);
}
function beginAgain(){
  const ks = Object.keys(QK).sort(() => Math.random() - 0.5).slice(0,3);
  sheet((el, close) => {
    el.append(h('h2','','A new life'), h('p','note','You wake again on the same rock, with your heirlooms. Pick a quirk for this life, or go without.'));
    ks.forEach(k => { const b = btn('chip wide',''); b.append(h('b','',QK[k].n), h('span','',' ' + QK[k].d)); b.onclick = () => { close(); newRun(k); }; el.append(b); });
    el.append(btn('chip wide','No quirk', () => { close(); newRun(''); }));
  }, true);
}

/* ---------- saving: this browser first, the viewer's Claude account when the page is hosted there ---------- */
const LS = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch (e) { return false; } } };
let cloudDoc = null, cloudBusy = false, cloudActs = -1;
function saveOpt(){ LS.set('tsd1.opt', JSON.stringify(opt)); }
function save(cloud){
  S.t = Date.now(); const json = JSON.stringify({S, M}); LS.set('tsd1.save', json);
  if (cloud && cloudDoc && !cloudBusy && cloudActs !== (S.acts||0) + S.ended) { cloudBusy = true; cloudActs = (S.acts||0) + S.ended; cloudDoc.set({json, t:S.t}).catch(() => {}).then(() => { cloudBusy = false; }); }
}
function adopt(o){ M = Object.assign(newMeta(), o.M); S = Object.assign(newState(o.S.quirk), o.S); S.m = Object.assign(newState('').m, o.S.m); welcomeBack(); sig = tabSig = ''; logSeen = null; cur = 'hull'; frameUI(); save(false); }
function welcomeBack(){
  const el = Math.max(0, (Date.now() - S.t)/1000); if (el < 15) return;
  S.bank = Math.min(10800, S.bank + el/3);
  if (S.paused || S.ended) { log(S,'You were away for ' + fmtTime(el) + ', paused. Time has been banked.',''); return; }
  const m0 = S.made, p0 = S.pop; simulate(S, Math.min(el, 12*3600));
  const msg = 'You were away for ' + fmtTime(el) + (el > 12*3600 ? ' (the hull only works twelve hours unattended)' : '') + '. The hull made ' + fmtLong(S.made - m0) + ' spoons' + (S.pop > p0 ? ' and woke ' + (S.pop - p0) + ' tardigrades' : '') + '.';
  log(S, msg, 'big'); toast(msg);
}
function newRun(q){ if (S && (S.ended || S.made > 0)) M.runs++; S = newState(q); log(S,'You are awake. You are a ship. Your instructions are one word long: spoons.','big'); if (M.runs) log(S,'This is not the first time you have woken up here. Your heirlooms are aboard.',''); sig = tabSig = ''; logSeen = null; cur = 'hull'; openK = {}; frameUI(); save(true); }
function setPause(p){ S.paused = p ? 1 : 0; log(S, p ? 'Paused. Time will bank while you are gone.' : 'Resumed.', ''); save(true); frameUI(); }
async function cloudInit(){
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]); if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const doc = db.doc('data/users/' + id + '/save'), snap = await doc.get(); cloudDoc = doc;
    if (snap.exists) { const d = snap.data(); if (d && d.json && (d.t||0) > loadedT + 60000) { const o = JSON.parse(d.json); if (o.S && o.M) { for (const k of ['endings','ach','guide']) o.M[k] = Object.assign({}, M[k], o.M[k]); adopt(o); toast('Save restored from your account.'); } } }
  } catch (e) {}
}

/* ---------- clock ---------- */
let lastT = performance.now(), accT = 0, secT = 0, saveT = 0, cloudT = 0, rafN = 0;
function step(){
  const now = performance.now(); let dt = (now - lastT)/1000; lastT = now; if (dt <= 0) return;
  if (S.paused) { S.bank = Math.min(10800, S.bank + dt/3); }
  else if (dt > 5) { const m0 = S.made; simulate(S, Math.min(dt, 12*3600)); S.bank = Math.min(10800, S.bank + dt/3); if (dt > 60) toast('Away ' + fmtTime(dt) + ': +' + fmtLong(S.made - m0) + ' spoons.'); }
  else { let sp = 1; if (S.flux) { if (S.bank > 0) { sp = 4; S.bank = Math.max(0, S.bank - dt*3); } else { S.flux = 0; log(S,'The banked time has run out.',''); } }
    accT += dt*sp; let n = 0; while (accT >= 0.2 && n++ < 200) { tick(S, 0.2, true); accT -= 0.2; } }
  secT += dt; if (secT >= 1) { secT = 0; checks(S); }
  saveT += dt; if (saveT >= 10) { saveT = 0; save(false); }
  cloudT += dt; if (cloudT >= 180) { cloudT = 0; save(true); }
  frameUI();
}
function paint(){
  requestAnimationFrame(paint); if (document.hidden || !C) return;
  rafN++; if (rafN % (opt.calm ? 30 : 2)) return;
  pulseV *= 0.86;
  Sky.draw({SEA:C.cal.frac, WARM:clamp(C.seasonM/1.5, 0.12, 1.1), BEDS:clamp(Math.log(1 + nb(S,'bed'))/Math.log(60), 0, 1), POP:clamp(Math.sqrt(S.pop)/14 + (S.pop > 0 ? 0.07 : 0), 0, 1), PH:S.phase,
    COM:S.comet > 0 ? 1 - S.comet/22 : -1, DRIFT:C.drift, PULSE:pulseV, TUN:S.pop ? S.tun/S.pop : 0, GOLD:S.ended == 'books' ? 1 : 0, FLEET:clamp(Math.log10(1 + S.ladles + S.forks)/22, 0, 1), BELT:clamp(S.belt/2e11, 0.1, 1)});
}
function start(hot){
  main = $('main'); M = newMeta();
  try { const o = JSON.parse(LS.get('tsd1.opt') || '{}'); opt = Object.assign(opt, o); } catch (e) {}
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && LS.get('tsd1.opt') == null) opt.calm = 1;
  let o = hot && hot.S ? hot : null;
  if (!o) { try { o = JSON.parse(LS.get('tsd1.save') || 'null'); } catch (e) { o = null; } }
  Sky.init($('sky')); buildChrome();
  if (o && o.S && o.S.r && o.M) { loadedT = o.S.t || 0; adopt(o); } else { S = null; newRun(''); }
  setInterval(step, 200); requestAnimationFrame(paint);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); else step(); });
  window.addEventListener('pagehide', () => save(false));
  cloudInit();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => JSON.parse(JSON.stringify({S, M}))); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
