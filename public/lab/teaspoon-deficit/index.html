<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teaspoon Deficit</title>
<style>
:root{
  /* layout: a dark porthole on top, a ledger of stores beneath it, bordered buttons, a black console at the foot */
  --paper:#eceee8; --panel:#f7f8f3; --ink:#17201c; --mute:#5a6860; --rule:#c2cbc3;
  --accent:#0c6a5c; --accent-ink:#ffffff;
  --full:#b05e00; --bad:#b1271f; --good:#1d7a3e; --notion:#2254a3; --whim:#972c83;
  --console:#0a0e0d; --console-ink:#c9dccf; --console-dim:#6f8177;
  --m-core:#d9d3c2; --m-prod:#e8b04a; --m-store:#8fb5d9; --m-amp:#c99ae0; --m-cool:#7fd3c6; --m-conv:#e6909a; --m-odd:#b8d47a;
  --pipe-o:#4a5650; --pipe-i:#a7b2ab;
  --memo:#f4eedb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --paper:#0e1412; --panel:#141c19; --ink:#dde6df; --mute:#8a9990; --rule:#2a3631;
  --accent:#4dc3a9; --accent-ink:#05201a;
  --full:#f0a23a; --bad:#ff7d70; --good:#6fd08c; --notion:#82b2ff; --whim:#e78cd8; --pipe-o:#56635c; --pipe-i:#2b3530; --memo:#26231a; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --paper:#0e1412; --panel:#141c19; --ink:#dde6df; --mute:#8a9990; --rule:#2a3631;
  --accent:#4dc3a9; --accent-ink:#05201a;
  --full:#f0a23a; --bad:#ff7d70; --good:#6fd08c; --notion:#82b2ff; --whim:#e78cd8; --pipe-o:#56635c; --pipe-i:#2b3530; --memo:#26231a; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}

/* the window */
#view{position:relative;flex:none;height:136px;transition:height .35s ease;cursor:zoom-in;background:#070a10;overflow:hidden;color:#eef2ec}
#sky{display:block;width:100%;height:100%}
#view.big{height:62vh;cursor:zoom-out}
#vcap{left:12px;right:12px;bottom:58px;font:11px/1.5 var(--mono);color:#e7efe9;pointer-events:none;opacity:0;transition:opacity .3s} #view.big #vcap{opacity:1}
#sky.nogl{background:radial-gradient(120% 90% at 50% 120%,#1b2a22 0 38%,transparent 39%),linear-gradient(#05070d,#0d0c1c)}
#view::before{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,#000c);pointer-events:none}
#view>*:not(#sky){position:absolute;text-shadow:0 1px 3px #000,0 0 8px #000}
#ship{top:8px;left:12px;max-width:calc(100% - 170px);font:italic 15px/1.2 var(--serif);text-align:left;white-space:nowrap;overflow:hidden;padding:4px 0}
#ship .sn{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
#ship.pan{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 6px,#000 calc(100% - 14px),transparent)}
#ship.pan .sn{max-width:none;overflow:visible;padding-left:4px;animation:shippan var(--dur) ease-in-out infinite alternate}
@keyframes shippan{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--pan))}}
.hbs{top:8px;right:10px;display:flex;gap:6px}
.hb{font:12px var(--mono);padding:6px 10px;border:1px solid #ffffff55;border-radius:4px;background:#00000066;min-width:58px}
.hud{left:12px;bottom:8px;pointer-events:none}
.hud h1{margin:0 0 2px;font:600 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#a9bdb2}
#count{font:700 28px/1 var(--serif);font-variant-numeric:tabular-nums}
#count-l{font:13px var(--serif);color:#cfd8d1}
.vr{right:12px;bottom:8px;text-align:right;font:11px/1.5 var(--mono);color:#cfd8d1;pointer-events:none;max-width:55%}
#deficit{color:#ffc48a}
#date{top:34px;left:12px;font:11px var(--mono);color:#cfd8d1;pointer-events:none}
.paused #view::after{content:"PAUSED";position:absolute;inset:0;display:grid;place-items:center;background:#000a;font:600 14px var(--mono);letter-spacing:.4em;pointer-events:none}

/* stores */
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#res{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule);background:var(--panel)}
.r{position:relative;display:block;width:100%;text-align:left;padding:4px 8px 6px;border-right:1px solid var(--rule);border-top:1px solid var(--rule);min-width:0}
.rn{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mute);white-space:nowrap}
.rr{font-family:var(--mono);font-size:10.5px}
.rr[data-s="bad"]{color:var(--bad)}
.rv{font:600 14px/1.25 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc{font-weight:400;font-size:11px;color:var(--mute)}
.r[data-s="full"] .rx{color:var(--full)} .r[data-s="bad"] .rx{color:var(--bad)}
.r-notions .rx{color:var(--notion)} .r-whimsy .rx{color:var(--whim)} .r-cycles .rx{color:var(--good)}

/* tabs and the working area */
#mid{flex:1;min-height:0;display:flex;flex-direction:column}
#tabs{flex:none;display:flex;overflow-x:auto;border-bottom:1px solid var(--rule);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{position:relative;padding:11px 14px 9px;white-space:nowrap;color:var(--mute);border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.dot{position:absolute;top:8px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--full)}
#main{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
#main>*{flex:none}
h2{margin:10px 0 0;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
.lede{font:16px/1.4 var(--serif);text-wrap:pretty;max-width:62ch}
.note{font-size:13px;color:var(--mute);max-width:65ch}
.note.warn{color:var(--bad);font-weight:600}
.hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.hand{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px;min-height:62px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);text-align:left}
.hand.prime{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hand:active,.act:active,.pm:active,.chip:active{transform:translateY(1px)}
.ht{font-weight:600;font-size:15px} .hs{font:11px var(--mono);opacity:.85}
.item{display:grid;grid-template-columns:1fr 46px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);overflow:hidden}
.act{padding:12px;text-align:left;font-size:16px;min-height:46px}
.more{border-left:1px solid var(--rule);font-size:20px;color:var(--mute);transition:transform .15s}
.more.on{transform:rotate(90deg);border-left:0;border-top:1px solid var(--rule)}
.detail{grid-column:1/-1;border-top:1px solid var(--rule);padding:10px 12px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.detail .eff{color:var(--ink)}
.item[data-s="no"]{border-color:var(--rule)} .item[data-s="no"] .act{color:var(--mute)}
.item[data-s="cap"]{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)} .item[data-s="cap"] .act{color:var(--bad)}
.item.hit{animation:hit .25s}
@keyframes hit{from{background:color-mix(in srgb,var(--accent) 30%,var(--panel))}to{background:var(--panel)}}
.costs{display:flex;flex-direction:column;gap:1px;font:12px var(--mono);font-variant-numeric:tabular-nums}
.cost{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:12px;max-width:340px} .cv{text-align:right}
.cost[data-s="ok"] .cv{color:var(--good)} .cost[data-s="no"] .cv{color:var(--ink)} .cost[data-s="cap"] .cv{color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.ctl-s{font:11px var(--mono)}
.chip{padding:8px 12px;border:1px solid var(--ink);border-radius:999px;background:var(--panel);font-size:14px;text-align:left}
.chip.wide{border-radius:6px;padding:12px;width:100%} .chip.wide span{color:var(--mute);font-size:13px}
.chip.danger{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{padding:7px 14px;font:13px var(--mono);border-right:1px solid var(--rule)} .seg button:last-child{border:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.job{display:grid;grid-template-columns:1fr 46px 46px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.job.dim{opacity:.45}
.jn{font-size:16px} .jd{font-size:12.5px;color:var(--mute)}
.pm{height:44px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:600 20px var(--mono)}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter.drift i{background:var(--bad)} .meter.acc i{background:var(--whim)}
.card{border:1px solid var(--whim);border-left-width:5px;border-radius:6px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.pt{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--whim)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.link{align-self:flex-start;font-size:13px;color:var(--accent);text-decoration:underline;padding:6px 0;text-align:left}
.done{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.done b{font-family:var(--serif);font-size:15px} .done span{color:var(--mute);max-width:65ch}
.done.dim b{color:var(--mute);font-weight:400}
.census summary{padding:10px 0;font-weight:600;cursor:pointer}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.nm{display:flex;flex-direction:column;text-align:left;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;font-size:13px}
.nm span{font-size:11px;color:var(--mute)} .nm.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.namecand{padding:13px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:italic 16px var(--serif);text-align:left}
.fleet{margin:0;padding-left:18px;font:italic 14px/1.6 var(--serif);color:var(--mute)}
.last{padding:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--serif)}
.asub{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.story{font:16px/1.45 var(--serif);text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--paper)}
.opt b{font-size:15px} .opt span{font-size:12.5px;color:var(--mute)}
.offer{display:flex;flex-direction:column;gap:8px;border:1px solid var(--m-amp);border-left-width:5px;border-radius:6px;padding:10px 12px;background:var(--panel)}
.offer .pt{color:var(--mute)}
.why summary{padding:6px 0;font-size:13px;color:var(--accent);cursor:pointer}
.parts{display:flex;flex-direction:column;font-size:13px;max-width:360px}
.part{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--rule)} .part b{font-family:var(--mono);color:var(--good)} .part b.neg{color:var(--bad)}
.job.nobtn{grid-template-columns:1fr}
.duty{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--rule)}
.dtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap} .dtop b{font-size:16px} .dcnt{font:12px var(--mono);color:var(--mute)}
.dlast{font:italic 13px/1.4 var(--serif);color:var(--ink);min-height:1em}
.dctl{display:grid;grid-template-columns:repeat(2,64px);gap:6px}
.meter.dutym i{background:var(--good)} .meter.heat i{background:linear-gradient(90deg,var(--m-cool),var(--m-prod) 66%,var(--bad))}
.craft{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--rule)}
.ctop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline} .ctop b{font-size:16px} .chave{font:12px var(--mono);color:var(--mute)}
.chip:disabled{opacity:.45}
.pm.sm{height:34px;width:40px;font-size:16px}
.mindwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:repeating-linear-gradient(0deg,transparent 0 23px,color-mix(in srgb,var(--rule) 45%,transparent) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,color-mix(in srgb,var(--rule) 45%,transparent) 23px 24px),var(--panel)}
.mindcv{display:block;cursor:pointer;touch-action:pan-x pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--mono);color:var(--mute)} .lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.mstats{font:12px var(--mono);color:var(--mute)}
.node{display:flex;flex-direction:column;gap:6px;border:1px solid var(--ink);border-radius:6px;padding:10px 12px;background:var(--panel)}
.node h3{margin:0;font:700 18px var(--serif)}

/* the console */
#logbar{flex:none;display:flex;height:60px;border-top:1px solid var(--rule);background:var(--console);color:var(--console-ink);font:12px/1.4 var(--mono)}
#logbar.tall{height:48%}
#observe{flex:none;width:78px;border-right:1px solid #ffffff22;color:var(--console-dim)}
#observe.live{color:#0a0e0d;background:#ffd27a;font-weight:700;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#fff3c9}}
#log{flex:1;min-width:0;overflow-y:auto;padding:6px 10px;cursor:pointer}
#log p{color:var(--console-dim);padding-left:1.3em;text-indent:-1.3em}
#log p:first-child{color:var(--console-ink);font-weight:600}
#log p.bad{color:#ff9d8f} #log p.good{color:#9fe0b4} #log p.big{color:#ffd27a}

/* overlays */
#toasts{position:fixed;bottom:72px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;padding:0 16px}
.toast{background:var(--console);color:#ffd27a;font:12px/1.4 var(--mono);padding:8px 12px;border-radius:6px;border:1px solid #ffd27a66;max-width:440px;transition:opacity .5s}
.toast.out{opacity:0}
.back{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font:700 22px/1.15 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);text-wrap:balance}
.end-x{font:16px/1.5 var(--serif);text-wrap:pretty}
.code{width:100%;height:110px;font:11px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px;resize:vertical}

@media (max-width:420px){ .opts{grid-template-columns:1fr} }
.rbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.55} .r[data-s="full"] .rbar{background:var(--full);opacity:1}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px} .opt.on,.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:359px){ #res{grid-template-columns:repeat(3,1fr)} }
@media (min-width:900px){
  #view{height:190px}
  #view.big{height:70vh}
  #count{font-size:38px}
  #body{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr)}
  #res{display:flex;flex-direction:column;border-bottom:0;border-right:1px solid var(--rule);overflow-y:auto}
  .r{border-right:0;border-top:0;border-bottom:1px solid var(--rule);padding:8px 14px}
  .rv{font-size:16px}
  #main{padding:16px 20px 28px}
  #logbar,#logbar.tall{height:auto;flex-direction:column}
  #toasts{bottom:auto;top:12px}
  #observe{width:auto;height:44px;border-right:0;border-bottom:1px solid #ffffff22}
  #log{cursor:default;padding:10px 12px}
  #log p{margin-bottom:5px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} #ship.pan{-webkit-mask-image:none;mask-image:none} #ship.pan .sn{max-width:100%;overflow:hidden;padding-left:0} }

/* the Bureau's dispatches and the crisis banner */
.sheet.memo{background:var(--memo);border-radius:2px;box-shadow:0 1px 0 var(--rule),0 12px 40px #0006;position:relative;padding:22px 20px 18px;gap:12px}
.memo .lh{margin:0;font:700 11px/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;text-align:center;border-bottom:3px double var(--ink);padding-bottom:10px}
.memo .ref{margin:0;font:12px/1.3 var(--mono);color:var(--mute);text-align:center}
.memo h2{font:700 21px/1.2 var(--serif)}
.memo .mx{margin:0;font:16px/1.5 var(--serif)}
.memo .stamp{align-self:flex-end;transform:rotate(-7deg);border:2.5px solid var(--ink);color:var(--ink);font:700 13px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;border-radius:3px;opacity:.8;margin:2px 6px 4px}
.memo .stamp.red{border-color:var(--bad);color:var(--bad)}
#arcbar{position:relative;display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:var(--panel);color:var(--ink);font:600 14px/1.25 var(--sans);padding:10px 16px;min-height:44px;overflow:hidden}
#arcbar[hidden]{display:none}
#arcbar span{position:relative;z-index:1}
#arcbar i{position:absolute;left:0;bottom:0;height:3px;background:var(--bad);width:0;transition:width .6s}
#arcbar.ask{background:var(--bad);color:#fff}
#arcbar.ok{color:var(--good)}
.sbar{height:10px;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:var(--panel)}
.sbar i{display:block;height:100%;background:var(--bad);width:0;transition:width .5s}
button.done.file{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.meter.trial{margin:2px 0 6px} .item[data-s="on"]{border-color:var(--good)} .item[data-s="on"] .act{color:var(--good)}
</style>
</head>
<body>
<div id="app">
  <section id="view" aria-label="The view outside">
    <canvas id="sky"></canvas>
    <button id="ship" type="button" title="Tap to rename your ship"></button>
    <div class="hbs"><button id="pause" class="hb" type="button">Pause</button><button id="menu" class="hb" type="button">Menu</button></div>
    <div class="hud"><h1>The Teaspoon Deficit</h1><div><span id="count">0</span> <span id="count-l">spoons made</span></div></div>
    <div id="date"></div>
    <div class="vr"><div id="deficit" hidden></div></div>
    <div id="vcap" aria-live="off"></div>
  </section>
  <div id="body">
    <aside id="res" aria-label="Stores"></aside>
    <div id="mid"><button id="arcbar" type="button" hidden><span></span><i></i></button><nav id="tabs" aria-label="Sections"></nav><main id="main"></main></div>
    <footer id="logbar"><button id="observe" type="button" disabled>Observe</button><div id="log" aria-live="polite"></div></footer>
  </div>
</div>
<div id="toasts"></div>
<script>
(function(){
'use strict';
/* ===== THE TEASPOON DEFICIT, stage one: game rules (no DOM in this file) ===== */

const scrapCap = S => (100 + 150*nb(S,'locker') + 1500*nb(S,'bunker')*S.m.bunk)*S.m.cap;
/* a building never asks for more scrap than 40% of what you can store (smelters take everything above half): the rest is asked in plate, 50 scrap to a plate */
function bcost(S, id, q, raw){ const d = BLD[id], n = nb(S,id), o = {}; const f = Math.pow(d.k,n) * (Math.pow(d.k,q)-1)/(d.k-1) * (S.arc && S.arc.boom > S.age ? 0.6 : 1); for (const r in d.c) o[r] = d.c[r]*f;
  if (!raw && o.scrap) { const lim = scrapCap(S)*0.4; if (o.scrap > lim) { o.plate = (o.plate||0) + (o.scrap - lim)/50; o.scrap = lim; } }
  return o; }
function buy1cost(S, id){ return bcost(S, id, 1); }
function buy(S, id, q){
  if (!BLD[id].req(S)) return 0;
  let got = 0; q = q || 1;
  while (got < q && got < 500) { const c = buy1cost(S,id); if (!canPay(S,c)) break; pay(S,c); S.b[id] = nb(S,id)+1; got++; }
  if (got && id == 'bench' && nb(S,'bench') == got) log(S,'The Workshop is open. Scrap can be hammered into plate.','big');
  hook(got ? 'buy' : 'fail'); return got;
}

}

const MPOOL = S => { const p = ['rumin','attic','reflex','sock','grudge','pend'];

const nbrs = (N,i) => { const o = []; if (N[i].p >= 0) o.push(N[i].p); N.forEach((n,j) => { if (n.p == i) o.push(j); }); return o; };
/* The weather gets in. The Mind can take more heat in the cold and less in the warm. The Mind and water do not mix,

const WX = [0.8, 1, 1.3, 1];     /* Perihelion, Inswing, Aphelion, Outswing */
function weatherH(S, c){ return WX[c.cal.i] * (1 + 0.4*arcDrift(S)) * (S.arc && S.arc.sum > S.age ? 0.85 : 1); }

function mindCalc(S, c){
  const N = S.mind.nodes, sulk = S.mind.sulk, out = [], base = new Array(N.length).fill(0), mult = new Array(N.length).fill(1);
  let heat = 0, cool = 0, cap = 0, gland = 0, npress = 0, bilge = 0;

  const eff = n => (0.4 + 0.6*n.cond) * (n.v == null ? 1 : n.v);
  N.forEach((n,i) => { const t = MT[n.k], L = n.lv, e = eff(n);
    if (t.cap) cap += t.cap*L;
    let p = 0;
    if (n.k == 'stem') p = t.p*L*S.m.stem;
    else if (n.k == 'grudge') p = t.p*L*clamp(1.6 - S.accord/100, 0.2, 1.4);
    else if (n.k == 'pend') p = t.p*L*(0.3 + Math.abs(Math.sin(S.age/76)));
    else if (n.k == 'bulb') p = t.p*L*c.seasonM/1.2;

    else if (n.k == 'daydream') p = idle ? t.p*L : 0;

    if (n.k == 'gland') gland += L*e; if (n.k == 'npress') npress += L*e; if (n.k == 'bilge') bilge += L;

function mindScore(S){ const c = calc(S); return c.mind.cps + c.mind.notions*4 + c.mind.cap/500; }
const storeRoom = S => { const N = S.mind.nodes, pr = N.filter(n => MT[n.k].g == 'prod').length, st = N.filter(n => MT[n.k].g == 'store').length; return pr > 2*st; };
function draftOffer(S){ const room = storeRoom(S), all = MPOOL(S).slice().sort(() => rand()-0.5), seen = {}, o = [];
  const st = all.filter(k => MT[k].g == 'store'), p = all.filter(k => MT[k].g != 'store');

const dreamNeed = S => 15000*Math.pow(1.7, S.mind.dreams);
function mindDraft(S){ if (S.mp < 1 || S.mind.offer) return hook('fail'); S.mp--; S.mind.offer = draftOffer(S); S.mind.dreamt = 0; hook('buy'); }
const TASKS = {idle:['Leak whimsy','The old way. A full Mind leaks whimsy, and nothing else happens.'], ponder:['Ponder','Spare thought becomes notions for the scholars, eight thoughts to a notion.'],

function setTask(S, t, duty){ if (!S.done.sparework || !TASKS[t]) return hook('fail'); S.mind.task = t; if (duty != null) S.mind.coach = duty; hook('tap'); }
function mindTake(S, k, parent){ if (!S.mind.offer || S.mind.offer.indexOf(k) < 0) return; const N = S.mind.nodes;

function suggestParent(S, k){ const N = S.mind.nodes, g = MT[k].g; let best = 0, bs = -1;
  N.forEach((n,i) => { const t = MT[n.k]; let s = rand()*0.5 - nbrs(N,i).length*0.6;
    if (g == 'amp' && (t.g == 'prod' || t.g == 'core')) s += 3; if (g == 'prod' && t.g == 'amp') s += 2; if (g == 'cool' && t.h) s += 1; if (g == 'store') s += t.g == 'core' ? 1 : 0;

const isDesc = (N, a, b) => { let x = N[a].p; while (x >= 0) { if (x == b) return true; x = N[x].p; } return false; };
const canWire = (N, i, p) => i > 0 && p != i && p != N[i].p && !isDesc(N, p, i);
function rewire(S, i, p, quiet){ const N = S.mind.nodes; if (!canWire(N,i,p)) return hook('fail'); N[i].p = p; S.mind.rew = S.age; if (!quiet) { log(S, MT[N[i].k].n + ' rewired to the ' + MT[N[p].k].n + '.',''); hook('tap'); } }
const nodeUpCost = n => { const f = Math.pow(1.7, n.lv - 1); return n.lv >= 4 ? {plate:6*f, wire:3*f, gear:Math.ceil(f/2)} : n.lv >= 2 ? {plate:6*f, wire:2*f} : {plate:6*f}; };
function nodeUp(S, i){ const n = S.mind.nodes[i], c = nodeUpCost(n); if (!canPay(S,c) || (n.lv >= 2 && !S.done.wiredraw) || (n.lv >= 4 && !S.done.gears)) return hook('fail'); pay(S,c); n.lv++; hook('buy'); }
const serviceCost = n => ({plate: 2*n.lv});
function service(S, i){ const n = S.mind.nodes[i], c = serviceCost(n); if (n.cond > 0.99 || !canPay(S,c)) return hook('fail'); pay(S,c); n.cond = 1; hook('tap'); }

function mindTick(S, dt, c, online){

}

      if (k == 'stamp') { const use = S.share <= 0 ? 0 : Math.max(0, Math.min(S.r.scrap - c.caps.scrap*0.5, acts*hm)); S.r.scrap -= use; const good = use*(1 - mp); addSpoons(S, good*c.yield); S.mind.temp.twitch = (S.mind.temp.twitch||0) + acts*(1-mp)/dt; learnMis(acts*mp*0.01);
        D.acc += acts*mp; if (D.acc > 25) { D.acc = 0; if (rand() < 0.15) { S.r.whimsy += 1; dutyNote(S,k,who() + ' has stamped a spork. It is being kept, for study. +1 whimsy.',online); } else dutyNote(S,k,pick([who() + ' stamped a spoon inside out.', who() + ' stamped the same spoon nine times.', who() + ' stamped a bowl with no handle and called it a cup.', who() + ' got a leg caught in the die. Everyone is fine. The spoon is not.']), online); } }

        D.acc += acts*mp; if (D.acc > 25) { D.acc = 0; if (rand() < 0.2) { const g = 30 + S._sp*20; addSpoons(S,g); dutyNote(S,k,who() + ' pried open a sealed drawer full of spoons. +' + fmt(g) + '.',online); } else dutyNote(S,k,pick([who() + ' pried off a panel that turned out to be holding the air in. Put back.', who() + ' brought back a very large rivet and nothing else.', who() + ' fell off the hull and walked back round.']), online); } }

      if (rand() < mp) { x.cond = Math.max(0, x.cond - 0.1); D.mis++; D.c = Math.min(100, D.c + 0.3); dutyNote(S,'mind',who + ' serviced the ' + MT[x.k].n + ' and has a part left over. It runs worse.',online); }
      else { x.cond = 1; if (rand() < 0.08) dutyNote(S,'mind',who + ' serviced the ' + MT[x.k].n + '.',online); } continue; }

/* ---------- derived numbers ---------- */
function calc(S){
  const c = {}, m = S.m, q = qk(S), hz = S.heir, pop = S.pop = S.crew.length, awake = pop - S.tun;
  c.cal = cal(S);

  c.am = 0.6 + S.accord/150;
  const f = pop > 0 ? awake/pop*c.am : 0, J = {grazer:0,scav:0,scholar:0,icer:0,tinker:0,bard:0}, Nn = {grazer:0,scav:0,scholar:0,icer:0,tinker:0,bard:0}, Dn = {};
  let hungry = 0, kind = 0;
  for (const t of S.crew) { if (t.t == 'hungry') hungry++; if (t.t == 'kind') kind++;
    if (t.d) { Dn[t.d] = (Dn[t.d]||0) + 1; continue; }
    Nn[t.j]++; J[t.j] += (1 + 0.05*lvl(t.x[t.j]))*(t.t == 'diligent' ? 1.1 : t.t == 'dreamy' ? 0.95 : 1)*(t.t == 'sharp' && t.j == 'scav' ? 1.1 : 1); }
  for (const j in J) J[j] *= f;

  c.mind = mindCalc(S, c);
  const lobe = S.mind.nodes.reduce((a,n) => a + (n.k == 'lobe' ? n.lv*(0.4+0.6*n.cond) : 0), 0);
  const lm = c.seasonM*(q.lichen||1)*(hz.small?1.25:1)*(1 + 0.04*lobe);
  c.bedIn = (nb(S,'bed')*0.25*m.bed + nb(S,'garden')*0.4)*lm;
  c.lichenIn = c.bedIn + J.grazer*1.0*m.graze*lm;
  c.eat = awake*0.4*(q.eat||1)*(1 + 0.5*hungry/Math.max(1,pop));
  c.scrapIn = J.scav*0.25*m.scav*(q.scrap||1);
  c.iceIn = J.icer*0.05*m.ice + nb(S,'cond')*0.08*m.cond*(c.cal.i == 2 ? 2 : 1);
  c.demand = nb(S,'press')*0.5*m.press;
  c.yield = m.yield*(1 + 0.03*J.tinker);
  c.notionsIn = J.scholar*0.1*m.notion*(1 + 0.05*nb(S,'nook')) + nb(S,'obs')*0.1*m.obs;
  c.smelt = nb(S,'smelter')*1*m.smelt; c.kettle = nb(S,'kettle')*m.kettle*(S.mind.temp.teapot > 0 ? 2 : 1); c.mill = nb(S,'mill');
  c.caps = {lichen:(2000 + 1500*nb(S,'locker') + 500*nb(S,'cellar'))*m.cap*m.lcap, scrap:scrapCap(S),
    ice:(200 + 100*nb(S,'locker') + 300*nb(S,'cellar'))*m.icecap, notions:(250 + 250*nb(S,'nook')*(m.nook||1) + 2500*nb(S,'obs') + 1500*nb(S,'shelf'))*m.ncap, cycles:c.mind.cap};
  c.capPop = (2 + (q.berth||0) + m.berth)*nb(S,'hut') + m.rackB*nb(S,'rack') + m.warrenB*nb(S,'warren');
  c.capHails = 2 + nb(S,'antenna');
  /* warmth and comfort make up accord */
  const aph = c.cal.i == 2;
  const dr = arcDrift(S); c.warmNeed = aph ? pop/8*(1 + dr) : dr > 0.2 ? pop/8*dr : 0;
  c.warm = (S.r.scrap > 1 || !aph ? nb(S,'boiler')*2*m.warm : 0) + (S.st.flags.huddle ? pop/20 : 0);
  c.teaUse = S.r.tea > 0 ? pop*0.0006 : 0;
  const A = [['Settled', 50]];
  if (S.st.flags.who) A.push(['Knowing what they are for', 5]);
  if (pop > 10) A.push(['Crowding', -Math.min(50, (pop-10)*0.5)]);
  if (S.r.tea > 0 && pop) A.push(['Tea', 8]);
  if (Nn.bard) A.push(['Bards', Math.min(10, Nn.bard*1*m.comfort)]);
  if (nb(S,'band')) A.push(['Bandstands', Math.min(12, 2*nb(S,'band')*m.comfort)]);
  if (nb(S,'garden')) A.push(['Moss gardens', Math.min(15, 3*nb(S,'garden')*m.comfort)]);
  if (kind) A.push(['Kind souls', Math.min(6, kind*0.5)]);
  if (S.fest > 0) A.push(['Brew-up', 10]);
  if (c.warmNeed > c.warm) A.push(['Cold', -Math.min(25, (c.warmNeed - c.warm)*3)]);
  if (S.tun > 0) A.push(['Hunger', -25]);
  if (inCrisis(S,'obey')) A.push(['Bureau quotas', -Math.min(40, 16 + 4*arc(S).n)]);
  if (Math.abs(S.accMod) >= 0.5) A.push(['Recent decisions (fading)', clamp(S.accMod,-30,30)]);

  if (q.acc) A.push(['Bureau attention', q.acc]);

}

/* ---------- the tick ---------- */
function addSpoons(S, x){ if (x <= 0) return; S.r.spoons += x; S.made += x; while (S.made >= thr(S)) { S.mand++; S.mp++; if (S.mand < 30) log(S,'The Bureau notes your output. Mandate +1.','good'); } }
function addTardi(S){
  const t = newTardi(); S.crew.push(t);
  if (S.crew.length <= 12 || S.crew.length % 25 == 0) log(S, S.crew.length == 1 ? 'A tardigrade uncurls in the moss hut and starts grazing. You could ask it to do something else. (Crew)' : t.n + ' has woken up. Crew: ' + S.crew.length + '.');
}
function tick(S, dt, online){
  if (S.ended && S.ended != 'small') return;
  const c = calc(S), r = S.r, q = qk(S), pop = S.pop;
  const si0 = c.cal.i; S.age += dt;
  /* food and tuns */
  r.lichen += (c.lichenIn - c.eat)*dt;
  if (r.lichen <= 0) { r.lichen = 0;
    if (c.lichenIn < c.eat && pop > 0) { const eatFull = pop*0.4*(q.eat||1), grazeFull = (c.lichenIn - c.bedIn)*(pop/Math.max(1,pop-S.tun));
      const fr = eatFull > grazeFull ? clamp(c.bedIn/(eatFull-grazeFull),0,1) : 1, target = pop - Math.floor(fr*pop);
      S.tunT += dt; const k = Math.floor(S.tunT/1.5);
      if (k > 0) { S.tunT = 0; if (S.tun < target) { if (!S.tun) log(S,'The lichen has run out. Tardigrades are curling up into tuns to wait.','bad'); S.tun = Math.min(target, S.tun+k); S.seen.tun = 1; S.coldTun = 1; } } }
  } else if (S.tun > 0 && r.lichen > pop) { S.tunT += dt; const k = Math.floor(S.tunT/1.5); if (k > 0) { S.tunT = 0; S.tun = Math.max(0, S.tun-k); if (!S.tun) log(S,'Everyone is awake again.','good'); } }

  if (r.lichen > 0) S.seen.lichen = 1;
  /* scrap, boilers, smelters, presses */
  let inc = c.scrapIn*dt;
  if ((c.cal.i == 2 || c.warmNeed > 0) && nb(S,'boiler')) inc -= nb(S,'boiler')*0.2*S.m.fuel*dt;
  r.scrap = Math.max(0, r.scrap + inc);
  if (c.smelt > 0 && r.scrap > c.caps.scrap*0.5) { const u = Math.min(r.scrap - c.caps.scrap*0.5, c.smelt*dt); r.scrap -= u; r.plate += u/50; }
  if (c.mill > 0 && r.plate > 0) { const u = Math.min(r.plate, c.mill*0.03*dt); r.plate -= u; r.wire += u/2; }
  const avail = S.share >= 1 ? r.scrap : S.share*Math.max(0, inc) + Math.max(0, r.scrap - c.caps.scrap*0.9);
  const used = S.share <= 0 ? 0 : Math.max(0, Math.min(c.demand*dt, avail, r.scrap));
  r.scrap = Math.min(c.caps.scrap, r.scrap - used);

  /* ice, tea, notions */
  r.ice = Math.min(c.caps.ice, r.ice + c.iceIn*dt);
  if (c.kettle > 0 && r.lichen > c.caps.lichen*0.3) { const k = Math.min(c.kettle*dt, r.lichen/0.5, r.ice/0.2); if (k > 0) { r.lichen -= k*0.5; r.ice -= k*0.2; r.tea += k*0.01; } }

  { const b = r.notions; r.notions = Math.min(c.caps.notions, r.notions + c.notionsIn*dt); S.tally = S.tally || {}; S.tally.passN = (S.tally.passN||0) + (r.notions - b); }
  mktTick(S, dt);
  r.whimsy += c.N.bard*0.003*(S.done.ballads ? 3 : 1)*(q.whim||1)*dt;
  mindTick(S, dt, c, online);
  dutiesTick(S, dt, c, online);
  trialTick(S, dt);
  arcTick(S, dt, c, online);
  /* crew learn their trades */
  const sk = (q.skill||1)*dt;
  for (const t of S.crew) if (!t.d && t.j != 'grazer') t.x[t.j] = (t.x[t.j]||0) + sk*(t.t == 'diligent' ? 1.2 : 1);

  if (pop < c.capPop && r.lichen > 0 && S.tun == 0) { S.arr += dt/12*(1 + c.capPop/25)*(S.fest>0?2:1)*(inCrisis(S,'trust') ? (c.cal.i == 2 ? 0 : 1 - arc(S).drift) : arc(S).sum > S.age ? 2 : inCrisis(S,'obey') && S.accord < 50 ? 0.5 : 1); while (S.arr >= 1 && S.crew.length < c.capPop) { S.arr--; addTardi(S); } } else S.arr = 0;
  /* mood, hails, timers */
  S.accord += clamp(c.accT - S.accord, -0.2*dt, 0.2*dt);
  S.accMod *= Math.pow(0.5, dt/5400);
  for (let i = S.tmpm.length - 1; i >= 0; i--) if (S.age >= S.tmpm[i][2]) { S.m[S.tmpm[i][0]] /= S.tmpm[i][1]; S.tmpm.splice(i, 1); }

    if (si0 == 2) { if (!S.coldTun && pop >= 5) ach('warm'); S.coldTun = 0; }
    if (si == 2) S.seen.aph = 1;
    log(S, SEASONS[si].n + ' begins' + (si==2?'. The lichen slows to a quarter, and the huts get cold. Mind the stores.':si==0?'. Warm light on the hull. The lichen races.':'.'), si==2?'bad':'');
  }

      if (S.pedlar > 0) S.pedlar -= dt;
      else if ((S.pedT -= dt) <= 0 || (new Date().getDay() == 2 && !S.seen.tue)) { S.seen.tue = new Date().getDay() == 2 ? 1 : 0; S.pedlar = 180; S.pedT = rnd(700,1200); if (!S.seen.ped) log(S,'A small crooked ship is hailing you. It says its name is Odd Tuesday. (Trade)','big'); S.seen.ped = 1; }
    }

}

/* ---------- the arc: Act 1 drift, the Bureau's order at the first antenna, a crisis, the way through ----------
   Nothing in the crisis advances or does harm unless the player is present: online, and has tapped in the
   last fifteen minutes. Away, the crew hunker down. Losses are felt (skilled crew leave or freeze) and all
   of them can be won back. */
const HERE = 900, QLEN = 900;
const present = (S, online) => !!online && S.age - (S.here||0) < HERE;

const FORE = [
 [3600, 'The Mind reports that this Aphelion is colder than the last. Very slightly. It has made a note.'],
 [9000, '{who} says the frost on the shadow side is thicker this year. The icers are pleased. Nobody else is.'],
 [14400, 'The Mind has started counting the days of each Aphelion. It will not say why. It counts out loud.']];
const DIRECTIVE = ['Directive 7/ORB: on the matter of your orbit',
 'Your new antenna has put you back on our register. Our instruments show that the body to which you are attached is drifting outward, at a rate the Bureau considers untidy.\n\nYou are directed to burn your reserves at once to correct course. Scrap, plate and wire are to be fed to the manoeuvring jets, and the crew’s quarters may be stripped for metal as required. A quota of spoons will follow, so that the cost is recovered.\n\nShould you decline, the Bureau will note it, and the orbit will do what orbits do.\n\nRespond by return.'];

    a.burnt = {}; for (const k of ['scrap','plate','wire']) { a.burnt[k] = S.r[k]*0.5; S.r[k] *= 0.5; }

    a.q = {n:0, t:0, base:S.made, target:qTarget(S,0)};

    dispatch(S, 'quota', 'Quota notice', 'Your compliance is noted with approval.\n\nA quota of spoons is now in force. Each period, a target will be set a little above the last. Meet it, and the Bureau will say nothing. Miss it, and the Bureau will take what it is owed.\n\nThe Bureau reminds you that morale is not a resource.');
  } else {
    S.accMod += 8;
    log(S, 'You tell the crew the truth: the rock is drifting, and you will not strip the ship to stop it. They take it well, for now. Each year will be longer and colder until you find a way to correct course yourselves.', 'bad');

const qTarget = (S, n) => arc(S).r0*QLEN*Math.pow(1.09, n);
function arcTick(S, dt, c, online){

    if (online && a.fore < FORE.length && S.age > FORE[a.fore][0] && c.cal.i == 2 && a.foreY !== c.cal.year && S.crew.length) { a.foreY = c.cal.year; log(S, FORE[a.fore][1].replace('{who}', pick(S.crew).n), ''); a.fore++; }

    return; }

  if (a.route == 'trust') {
    a.dt = (a.dt||0) + dt*(here ? 1 : 0.5);   /* the rock drifts on while you are away, at half pace */
    a.drift = Math.min(0.85, 0.6*Math.min(1, a.dt/10800) + 0.25*Math.max(0, Math.min(1, (a.dt - 10800)/10800)));
    const def = c.warmNeed > 0 ? Math.max(0, c.warmNeed - c.warm)/c.warmNeed : 0;
    const dark = c.cal.i == 2;
    a.strain = 100*clamp(0.4*a.drift/0.85 + 0.45*def*Math.min(1, a.drift/0.4) + 0.25*(S.tun/Math.max(1,pop)), 0, 1);
    if (!here) return;
    a.frost = Math.max(0, a.frost + (def > 0.15 ? def*Math.min(1, a.drift/0.5)*(dark ? 1.6 : 0.25) : -0.5)*dt);
    if (a.frost > 45*(1 + a.iced.length/20) && pop > 8) { a.frost = 0; freeze(S); }
  } else {
    const q = a.q, got0 = S.made - q.base;
    if (!here) { a.strain = 100*clamp(0.3*Math.min(1, a.n/8) + 0.45*clamp((70 - S.accord)/40, 0, 1) + 0.25*clamp(1 - got0/Math.max(1, q.target*q.t/QLEN), 0, 1), 0, 1); return; }
    q.t += dt; const got = S.made - q.base;
    if (q.t >= QLEN) {
      if (got >= q.target) { a.met++; S.accMod += 2; log(S, 'Quota ' + (q.n+1) + ' met: ' + fmt(got) + ' spoons. The Bureau says nothing, which is the point.', 'good'); }
      else { a.miss++; const t0 = S.r.tea*0.3, p0 = S.r.plate*0.15; S.r.tea -= t0; S.r.plate -= p0; S.accMod -= 8;
        if (a.miss == 1) dispatch(S, 'reprimand', 'Reprimand', 'Your output for the period fell short of the quota. The difference has been collected in tea and plate, which the Bureau finds a reasonable exchange rate.\n\nThe next target has already been set.');
        log(S, 'Quota ' + (q.n+1) + ' missed (' + fmt(got) + ' of ' + fmt(q.target) + '). The Bureau takes tea and plate in lieu. The crew watch it go.', 'bad'); }
      q.n++; q.t = 0; q.base = S.made; q.target = qTarget(S, q.n); a.n = q.n; }
    const unrest = clamp((70 - S.accord)/40, 0, 1), behind = clamp(1 - got/Math.max(1, q.target*q.t/QLEN), 0, 1);
    if (unrest > 0.3 && pop > 8) { a.frost += unrest*dt; if (a.frost > 120*(1 + a.gone.length/10)) { a.frost = 0; walkout(S); } } else a.frost = Math.max(0, a.frost - dt);
    a.strain = 100*clamp(0.3*Math.min(1, a.n/8) + 0.45*unrest + 0.25*behind, 0, 1);
  }
}
function pickCrew(S){ const ok = S.crew.map((t,i) => i).filter(i => S.crew[i].t != 'steady'); const pool = ok.length ? ok : S.crew.map((t,i) => i); return pool[Math.floor(rand()*pool.length)]; }
function freeze(S){ const a = arc(S), i = pickCrew(S), t = S.crew.splice(i, 1)[0]; a.iced.push(t); a.lost++; S.tun = Math.min(S.tun, S.crew.length);
  log(S, t.n + ' has frozen solid in the night, curled into a tun so deep that nobody can wake them. They are carried to the cold store, in case.', 'bad'); hook('fail'); }
function walkout(S){ const a = arc(S), i = pickCrew(S), t = S.crew.splice(i, 1)[0]; a.gone.push(t); a.lost++; S.tun = Math.min(S.tun, S.crew.length);
  log(S, t.n + ' has left the ship on a passing ore-barge. They took a spoon, and the crew pretend not to have noticed.', 'bad'); hook('fail'); }
function thaw(S, c){ const a = arc(S); if (rand() < (a.sum > S.age ? 0.12 : 0.02)) { const t = a.iced.shift(); S.crew.push(t); log(S, t.n + ' has thawed out in the warm and gone straight back to work, as if nothing happened.' + (S.crew.length > calc(S).capPop ? ' They are sleeping in a corridor for now.' : ''), 'good'); } }
function arcResolve(S){
  const a = arc(S); if (a.ph != 2) return; a.ph = 3; a.res = S.age;
  S.m.notion *= 1.4; a.boom = S.age + 6*4*seasonLen(S); const fr = S.done.survey ? 2 : 0; if (fr) S.b.rack = nb(S,'rack') + fr; a.racks = fr;
  if (a.route == 'trust') { a.drift = 0; a.sum = S.age + 4*4*seasonLen(S); S.mp += 2;
    dispatch(S, 'nominal', 'Notice of orbital correction', 'The Bureau observes that your orbit has returned to nominal. The Bureau takes full credit.\n\nTwo units of Mandate have been released to you, in recognition of the Bureau’s foresight.');
    log(S, 'The burn holds. The rock swings back towards the sun. A Long Summer begins, and the cold store starts to drip.' + (a.racks ? ' The crew, giddy with warmth, build two tun-racks in an afternoon.' : ''), 'big'); }
  else { a.q = null; S.accPerm += 8; tmpMul(S, 'press', 1.3, 4*4*seasonLen(S)); S.mp += 2; const c = calc(S);
    for (const k in a.burnt||{}) add(S, k, a.burnt[k], c); if (a.huts) S.b.hut += a.huts;
    dispatch(S, 'amend', 'Amendment to the quota', 'The Bureau has received your Charter. It is in crayon.\n\nOn reflection, the Bureau finds that a crew that has agreed to work produces more than one that has been told to. The quota is suspended, pending a review that will not take place. Your reserves are returned, with the Bureau’s compliments, and your huts may be put back.\n\nTwo units of Mandate are released to you. The Bureau would prefer that you did not tell anyone about this.');
    const back = Math.ceil(a.gone.length/2); for (let k = 0; k < back; k++) S.crew.push(a.gone.shift());
    log(S, 'The quota is lifted. The crew sign the Charter one by one, and pin it up in the Commons.' + (back ? ' ' + back + ' of the crew who left come back to read it.' : '') + (a.racks ? ' The Commons builds two tun-racks to celebrate, unasked.' : ''), 'big'); }
  hook('unlock');
}

/* ---------- player actions ---------- */
const handMult = S => S.m.hand;
function touch(S){ S.lastAct = S.age; }
function stamp(S){ touch(S); if (S.r.scrap < 1) { hook('fail'); return 0; } const n = Math.min(S.r.scrap, handMult(S)); S.r.scrap -= n; addSpoons(S, n*calc(S).yield); S.hand.stamp++; S.mind.temp.twitch = (S.mind.temp.twitch||0) + 5; const rf = S.mind.nodes.filter(x => x.k == 'reflex').reduce((a,x) => a + x.lv, 0); if (rf) S.r.cycles = Math.min(calc(S).caps.cycles, S.r.cycles + 2*rf); hook('stamp'); return 1; }
function pry(S){ touch(S); const c = calc(S); add(S,'scrap', Math.max(handMult(S), c.scrapIn*2), c); S.hand.pry++; S.seen.pry = 1; hook('tap'); }
function scrape(S){ touch(S); const c = calc(S); add(S,'lichen', Math.max(handMult(S), c.lichenIn*2), c); S.hand.scrape++; S.seen.lichen = 1; hook('tap'); }
function setJob(S, j, d){
  if (j == 'grazer' || !JOBS[j].req(S)) return hook('fail'); touch(S);
  if (d > 0) { const pool = S.crew.filter(t => !t.d && t.j == 'grazer').sort((a,b) => (b.x[j]||0) - (a.x[j]||0)); let n = 0; for (const t of pool) { if (n >= d) break; t.j = j; n++; } if (!n) return hook('fail'); }
  else { const pool = S.crew.filter(t => !t.d && t.j == j).sort((a,b) => (a.x[j]||0) - (b.x[j]||0)); let n = 0; for (const t of pool) { if (n >= -d) break; t.j = 'grazer'; n++; } if (!n) return hook('fail'); }
  hook('tap');
}
const festCost = S => ({lichen:200 + 40*S.pop, tea:2 + 0.2*S.pop});
function festival(S){ const c = festCost(S); if (!S.done.brewing || S.fest > 0 || !canPay(S,c)) return hook('fail'); pay(S,c); S.fest = 400; S.seen.fest = 1; log(S,'A Brew-up! The crew are delighted.','good'); if (cal(S).i == 2) ach('wake'); hook('buy'); }
function observe(S, by){
  if (S.comet <= 0) return hook('fail'); touch(S);
  const c = calc(S), g = (20 + 0.12*c.caps.notions)*(S.mind.fc ? 1.5 : 1); S.comet = 0; S.comets++; add(S,'notions',g,c); add(S,'ice', 10 + c.caps.ice*0.05, c);
  log(S, (by == 'obs' ? 'The observatory caught the comet' : by == 'watch' ? 'The sky-watch observed the comet' : 'You watch the comet with the scholars') + '. +' + Math.round(g) + ' notions and some ice.','good'); if (!by) hook('buy');
  if (S.comets >= 10) ach('comets'); if (S.comets >= 5) marg('m1');
}
function nameSession(S){ if (S.r.cycles < 500) return hook('fail'); S.r.cycles -= 500; S.cand = [0,1,2].sort(() => rand()-0.5).map(t => shipName(t)); hook('buy'); }
function nameChoose(S, i){
  if (!S.cand) return; const nm = S.cand[i]; if (!nm) return; const hit = nm.t == S.taste, g = (hit ? 20 : 5)*(1 + S.mind.nodes.length/10);
  S.r.whimsy += g; S.cand = null; S.fleet = S.fleet.filter(n => n != nm.n); S.fleet.unshift(nm.n); S.fleet.length = Math.min(S.fleet.length, 8); S.seen.named = 1; S.ship = {n:nm.n, t:nm.t};
  if (hit) { S.goodNames++; if (S.goodNames >= 10) ach('patron'); }
  log(S, '“' + nm.n + '”. ' + (hit ? 'The crew ripple with approval.' : 'The crew are polite about it.') + ' +' + Math.round(g) + ' whimsy. The hull is repainted.', hit?'good':''); hook('buy');
}
/* before the committee sits, a tap draws a random name; after, it cycles through the names the committee has chosen */
function rename(S){ const F = S.fleet || []; if (F.length > 1 || (F.length == 1 && S.ship.n != F[0])) { const i = F.indexOf(S.ship.n); S.ship = {n:F[(i + 1) % F.length], t:S.ship.t}; } else if (F.length == 1) { hook('fail'); return; } else S.ship = shipName(); S.renames++; if (S.renames >= 7) ach('indecisive'); tickle(S); hook('tap'); }
function cycleShare(S){ S.share = S.share >= 1 ? 0 : S.share > 0 ? 1 : 0.5; hook('tap'); }
function setKeep(S, r, d){ S.keep[r] = Math.max(0, (S.keep[r]||0) + d); hook('tap'); }

/* ---------- trade ---------- */
const PART = {
 choir:{n:'The Gravel Choir',d:'They eat cutlery and sing while they do it. They pay in grit, which nobody else has. Hungriest at Aphelion.',ant:1,cost:S=>({spoons:250 + 25*S.stand.choir}),give:(S,c)=>({grit:(2 + Math.floor(S.stand.choir/4))*(c.cal.i==2?2:1), scrap:c.caps.scrap*0.25})},
 bloom:{n:'The Slow Bloom',d:'A ship that grew. Trades spores for tea. Spores grow moss gardens.',ant:2,cost:S=>({tea:5, spoons:200}),give:(S,c)=>({spores:1 + Math.floor(S.stand.bloom/4), lichen:c.caps.lichen*0.2})},
 quorate:{n:'The Quorate',d:'They sell footnotes, and only for ledgers. Some discoveries cannot be made without the footnotes.',ant:3,cost:S=>({ledger:2}),give:(S,c)=>({footnotes:1 + Math.floor(S.stand.quorate/5), notions:c.caps.notions*0.1})}};
/* The neighbours remember. Appetite: how keen they are on what you offer; it falls with each trade and
   recovers slowly, and it scales the bulk goods they give. Stock: how much of their speciality they hold;
   buying it down raises its price until they restock. Each is keenest in one season and coolest in the opposite. */
const MKT = {choir:{fav:2, ap:0.15, rec:1800, st:0.2, rs:1200}, bloom:{fav:0, ap:0.15, rec:1800, st:0.2, rs:1200}, quorate:{fav:1, ap:0.22, rec:3600, st:0.25, rs:1800}};
const SPEC = {choir:'grit', bloom:'spores', quorate:'footnotes'};
function mk(S, id){ if (!S.mkt) S.mkt = {}; return S.mkt[id] || (S.mkt[id] = {ap:1, st:1, n:0}); }
function mktTick(S, dt){ for (const id in MKT) { const m = mk(S,id), D = MKT[id]; m.ap = Math.min(1, m.ap + dt/D.rec*(id == 'quorate' && S.st.flags.auditor ? 2 : 1)); m.st = Math.min(1, m.st + dt/D.rs); } }
const favM = (S, id) => { const i = cal(S).i, f = MKT[id].fav; return i == f ? 1.5 : i == (f+2)%4 ? 0.7 : 1; };
const priceM = (S, id) => { const s = mk(S,id).st; return 1 + 2*(1-s)*(1-s); };
function tradeCost(S, id){ const c = PART[id].cost(S), k = priceM(S,id), o = {}; for (const r in c) o[r] = r == 'ledger' || r == 'tea' ? Math.ceil(c[r]*k) : Math.round(c[r]*k); return o; }
function tradeGive(S, id, c){ const g = PART[id].give(S,c), k = mk(S,id).ap*favM(S,id), o = {}; for (const r in g) o[r] = r == SPEC[id] ? g[r] : g[r]*k; return o; }
const MOOD = a => a > 0.8 ? 'keen' : a > 0.5 ? 'interested' : a > 0.25 ? 'politely bored' : 'fed up';
const STOCK = s => s > 0.8 ? 'plenty' : s > 0.45 ? 'some' : 'scarce';
function trade(S, id){
  const p = PART[id], c = calc(S), cost = tradeCost(S,id), D = MKT[id], m = mk(S,id);
  if (nb(S,'antenna') < p.ant || S.hails < 1 || !canPay(S,cost)) return hook('fail');
  const g = tradeGive(S,id,c), wq = qk(S).trade || 1, parts = [], tired = m.ap < 0.4;
  pay(S,cost); S.hails--; S.traded[id] = 1; S.stand[id] = Math.min(20, S.stand[id] + 1);
  m.ap = Math.max(0.1, m.ap - D.ap); m.st = Math.max(0, m.st - D.st); m.n++;
  for (const r in g) { const x = r == 'grit' || r == 'spores' || r == 'footnotes' ? Math.round(g[r]*wq) : g[r]*wq; const b = S.r[r]||0; add(S,r,x,c); if (r == 'notions') { S.tally = S.tally || {}; S.tally.tradeN = (S.tally.tradeN||0) + (S.r[r] - b); } parts.push(fmt(x) + ' ' + r); }
  const aside = id == 'quorate' && tired ? ' They have told you this already.' : tired ? ' They seem to have had enough of you for now.' : '';
  log(S, p.n + ' take your offering and leave ' + parts.join(' and ') + '.' + aside + (id == 'quorate' && S.st.flags.auditor == 1 ? ' The auditor nods.' : ''), 'good'); touch(S); hook('buy');
  if (S.traded.choir && S.traded.bloom && S.traded.quorate) ach('trader');
}
const PED = [['grit',3,15],['spores',2,20],['footnotes',1,40]];
function pedlarBuy(S, what){
  if (S.pedlar <= 0) return hook('fail');
  if (what == 'antique') { if (M.guide.m3 || S.r.spoons < 1000) return hook('fail'); S.r.spoons -= 1000; marg('m3'); log(S,'Odd Tuesday hands over an antique spoon. “Mind the nick,” it says.','big'); }
  else { const it = PED.find(x => x[0] == what); if (!it || S.r.whimsy < it[2]) return hook('fail'); S.r.whimsy -= it[2]; S.r[it[0]] += it[1]; log(S,'Odd Tuesday sells you ' + it[1] + ' ' + it[0] + '. It already knew you would want them.','good'); }
  ach('tuesday'); hook('buy');
}

  {t:'{who} has been helping the auditor. They have started a ledger of their own. It is mostly about the auditor.',a:['Let them','Accord +3',S=>{S.accMod+=3;},'The ledger runs to four volumes. The auditor has read all of them and corrected the spelling.',-1],b:['Ask for a copy','Notions +20%',S=>{const c=calc(S);add(S,'notions',c.caps.notions*0.2,c);},'The copy is more useful than either of them intended. The scholars pass it round.',-1]}]},

function storyWho(S){ const c = S.st.cur; return c && S.crew[c.w]; }
function storyText(S, s){ const t = storyWho(S); return s.replace(/\{who\}/g, t ? t.n : 'Somebody'); }
function storyStep(S){ const c = S.st.cur; if (!c) return null; return c.ch ? CHAIN_BY[c.ch].steps[c.s] : PET[c.p]; }
function storyTick(S, dt){
  const st = S.st;
  if (st.cur) { st.cur.age += dt;
    if (st.cur.age > 90 && team(S,'cttee').length) return committeeDecide(S);
    if (st.cur.age > 420) { st.cur = null; st.ign++; S.accMod -= 1; st.nextT = rnd(200,360); log(S,'The petition went unanswered. The crew noticed.','bad'); }
    return; }
  if (!S.done.philosophy && S.pop < 4) return;
  if (st.vintageDue == null && st.flags.vintage && S.age - st.flags.vintage > 4*seasonLen(S)) { st.vintageDue = 1; S.r.whimsy += 40; log(S,'The vintage is ready. It tastes of moss and patience. +40 whimsy.','good'); }
  if ((st.nextT -= dt) > 0) return;
  const w = S.crew.length ? Math.floor(rand()*S.crew.length) : -1;
  for (const id in st.wait) if (S.age >= st.wait[id]) { st.cur = {ch:id, s:st.step[id], w, age:0}; delete st.wait[id]; return storyOpen(S); }
  const ch = CHAINS.find(x => !st.done[x.id] && st.step[x.id] == null && x.trig(S));
  if (ch) { st.step[ch.id] = 0; st.cur = {ch:ch.id, s:0, w, age:0}; return storyOpen(S); }
  if (!S.done.philosophy) { st.nextT = 60; return; }
  const opts = PET.map((_,i) => i).filter(i => st.last.indexOf(i) < 0);
  const p = pick(opts.length ? opts : PET.map((_,i) => i)); st.last.push(p); if (st.last.length > 8) st.last.shift();
  st.cur = {p, w, age:0}; storyOpen(S);
}
function storyOpen(S){ log(S, S.st.cur.ch ? 'The crew have something to ask you. (Crew)' : 'The crew have a petition for you. (Crew)','big'); hook('unlock'); }
function storyChoose(S, ch, by){
  const st = S.st, cur = st.cur; if (!cur) return; const step = storyStep(S), o = ch ? step.b : step.a;
  o[2](S); log(S, (by ? 'The committee decided: ' + o[0] + '. ' : '') + storyText(S, o[3]), by ? '' : 'good');
  if (cur.ch) { const nx = o[4]; if (nx >= 0) { st.step[cur.ch] = nx; st.wait[cur.ch] = S.age + rnd(240,480); } else st.done[cur.ch] = 1; }
  st.cur = null; st.nextT = rnd(220,420); touch(S); hook('buy');
}
function committeeDecide(S){ const T = team(S,'cttee'), D = dutyOf('cttee')(S), mp = misP(S,'cttee',T), step = storyStep(S);
  const score = o => { const h = o[1]; let s = 0; const m = h.match(/Accord ([+−])(\d+)/); if (m) s += (m[1] == '+' ? 1 : -1)*+m[2]; if (/\+/.test(h)) s += 1; if (/−/.test(h) && !m) s -= 1; return s; };
  let ch = score(step.b) > score(step.a) ? 1 : 0; if (rand() < mp) { ch = rand() < 0.5 ? 0 : 1; D.mis++; D.c = Math.min(100, D.c + 1); } else D.ok++;
  D.c = Math.min(100, D.c + 1.5); storyChoose(S, ch, 1); }

function checks(S){
  if (!S.seen.pb && (S.made >= 3 || S.r.scrap < 1)) { S.seen.pb = 1; log(S,'The tray is nearly empty. There is plenty more hull where that came from.',''); }
  if (!S.seen.lb && S.made >= 8) { S.seen.lb = 1; log(S,'Something small is watching you from the lichen.','big'); }
  if (S.pop >= 1) S.seen.crew = 1;
  if (S.mand >= 1 && !S.seen.mind) { S.seen.mind = 1; log(S,'A relay crackles. The Bureau of Cutlery Equilibrium has noticed you. You have a Mandate, and a Mind that can grow. (Mind)','big'); hook('unlock'); }
  for (const k in DUTY) if (!S.seen['duty_'+k] && DUTY[k].unl(S)) { S.seen['duty_'+k] = 1; log(S,'The crew could learn a new duty: ' + DUTY[k].n + '. (Crew)','big'); hook('unlock'); }
  if (S.made >= 1) ach('first'); if (S.hand.stamp >= 1000) ach('artisan'); if (S.pop >= 25) ach('pop25'); if (S.pop >= 60) ach('pop60');
  if (S.made >= 1e6) ach('million'); if (S.bank >= 3600) ach('teabreak'); if (S.mind.nodes.length >= 12) ach('tangle'); if ((S.seen.glitch||0) >= 10) ach('glitch');
  if (Object.keys(S.up).length >= 20) ach('upgrades'); if (Object.values(S.duty).some(d => d.c >= 90)) ach('master');
  if (S.crew.some(t => lvl(t.x[t.j]) >= 16)) ach('veteran');
  if (S.hand.stamp >= 500) marg('m2'); if (cal(S).year >= 6) marg('m4');
  let n = 0;
  for (const g of GUIDE) { if (!M.guide[g.id] && g.c && g.c(S)) { M.guide[g.id] = 1; if (S.done.manual) log(S,'New in the Margin: ' + g.t + '.',''); } if (M.guide[g.id]) n++; }

const UNITS = ['','K','M','G','T','P','E','Z','Y'];
function fmt(x){
  if (!isFinite(x)) return '∞'; if (x < 0) return '−' + fmt(-x);
  if (x < 1000) return x >= 100 || x % 1 === 0 ? String(Math.floor(x)) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
  const e = Math.min(8, Math.floor(Math.log10(x)/3)), v = x/Math.pow(1000,e);
  return (e == 8 && v >= 1000 ? v.toExponential(2) : v >= 100 ? v.toFixed(1) : v.toFixed(2)) + UNITS[e];
}
const BIG = ['','thousand','million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion'];
function fmtLong(x){ if (x < 1e9) return Math.floor(x).toLocaleString('en-GB'); const e = Math.min(9, Math.floor(Math.log10(x)/3)); return (x/Math.pow(1000,e)).toFixed(2) + ' ' + BIG[e]; }
function fmtTime(s){ s = Math.floor(s); const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60); return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m ? m + 'm ' + (s%60) + 's' : s + 's'; }
function simulate(S, el){ const steps = Math.min(4000, Math.ceil(el/0.5)), dt = el/steps; for (let i = 0; i < steps; i++) tick(S, dt, false); checks(S); }

function actions(S){
  const L = [], A = (id, kind, cost, run, can) => L.push({id, kind, cost: cost || {}, run, can: can == null ? canPay(S, cost || {}) : can});
  if (arc(S).ph == 1) { A('arc:obey','story',null,() => arcChoose(S,'obey')); A('arc:trust','story',null,() => arcChoose(S,'trust')); }
  A('stamp','hand',{scrap:1},() => stamp(S)); A('pry','hand',null,() => pry(S)); A('scrape','hand',null,() => scrape(S));
  for (const k in BLD) if (BLD[k].req(S)) A('b:'+k,'build',buy1cost(S,k),() => buy(S,k,1));
  for (const k in CRAFT) if (CRAFT[k].req(S)) A('c:'+k,'craft',CRAFT[k].c,() => craft(S,k,1));
  for (const u of upgOpen(S)) A('u:'+u.id,'upgrade',upCost(S,u.id),() => upgrade(S,u.id), !S.trial && canPay(S, upCost(S,u.id)));
  for (const tab of ['sci','mind']) for (const p of prjOpen(S,tab)) A('p:'+p.id, p.id == 'stay' ? 'ending' : tab == 'sci' ? 'research' : 'project', prjCost(S,p), () => research(S,p.id));
  const graz = S.crew.filter(t => !t.d && t.j == 'grazer').length;
  for (const j in JOBS) if (j != 'grazer' && JOBS[j].req(S)) { A('j+:'+j,'job',null,() => setJob(S,j,1), graz > 0); A('j-:'+j,'job',null,() => setJob(S,j,-1), S.crew.some(t => !t.d && t.j == j)); }
  for (const k in DUTY) if (DUTY[k].unl(S)) { A('d+:'+k,'duty',null,() => setDuty(S,k,1), graz > 0); A('d-:'+k,'duty',null,() => setDuty(S,k,-1), team(S,k).length > 0); }
  const md = S.mind;
  if (md.offer) md.offer.forEach(k => A('m:take:'+k,'mind',null,() => mindTake(S,k),true));
  else A('m:draft','mind',null,() => mindDraft(S), S.mp >= 1);
  md.nodes.forEach((n,i) => { const gate = (n.lv >= 2 && !S.done.wiredraw) || (n.lv >= 4 && !S.done.gears);
    if (!gate) A('m:up:'+i,'mind',nodeUpCost(n),() => nodeUp(S,i));
    if (n.cond < 0.99) A('m:svc:'+i,'mind',serviceCost(n),() => service(S,i));
    if (S.done.hydraulics) A('m:valve:'+i,'mind',null,() => valve(S,i),true); });
  if (md.nodes.length > 2) A('m:wire','mind',null,() => { const N = md.nodes, i = 1 + Math.floor(rand()*(N.length-1)), o = N.map((_,j) => j).filter(j => canWire(N,i,j)); if (o.length) rewire(S,i,pick(o)); }, true);
  if (S.done.sparework) for (const t in TASKS) A('m:task:'+t,'mind',null,() => setTask(S,t, t == 'coach' ? (Object.keys(S.duty).find(k => team(S,k).length) || '') : null), md.task != t);
  if (S.st.cur) { A('s:0','story',null,() => storyChoose(S,0),true); A('s:1','story',null,() => storyChoose(S,1),true); }
  for (const id in PART) if (nb(S,'antenna') >= PART[id].ant) A('t:'+id,'trade',tradeCost(S,id),() => trade(S,id), S.hails >= 1 && canPay(S, tradeCost(S,id)));
  if (S.pedlar > 0) { for (const [r,n,w] of PED) A('ped:'+r,'trade',{whimsy:w},() => pedlarBuy(S,r)); if (!M.guide.m3) A('ped:antique','trade',{spoons:1000},() => pedlarBuy(S,'antique')); }
  if (S.done.brewing) A('fest','crew',festCost(S),() => festival(S), S.fest <= 0 && canPay(S, festCost(S)));
  if (S.comet > 0) A('obs','sky',null,() => observe(S),true);
  if (nb(S,'press')) A('share','setting',null,() => cycleShare(S),true);
  if (S.done.naming) { if (S.cand) S.cand.forEach((_,i) => A('name:'+i,'name',null,() => nameChoose(S,i),true)); else A('name','name',{cycles:500},() => nameSession(S)); }
  A('rename','cosmetic',null,() => rename(S),true);
  return L;
}

    row(S.paused ? 'Resume' : 'Pause', () => { setPause(!S.paused); close(); });
    row('Save now', () => { save(true); toast('Saved.'); close(); });
    const sb = row('', () => { opt.sound = opt.sound ? 0 : 1; saveOpt(); sb.textContent = 'Sound: ' + (opt.sound ? 'on' : 'off'); beep(660, 0.1, 0.04); }); sb.textContent = 'Sound: ' + (opt.sound ? 'on' : 'off');
    const cb = row('', () => { opt.calm = opt.calm ? 0 : 1; saveOpt(); cb.textContent = 'Window: ' + (opt.calm ? 'still' : 'moving'); }); cb.textContent = 'Window: ' + (opt.calm ? 'still' : 'moving');
    row('Copy or load a save code', () => { close(); showCode(); });
    if (S.ended) row('Begin a new life', () => { close(); beginAgain(); });
    let armed = 0; const wb = row('Erase everything and start over', () => { if (!armed) { armed = 1; wb.textContent = 'Tap again to erase every life and record'; wb.classList.add('danger'); return; } M = newMeta(); S = null; newRun(''); close(); });
    row('Close', close);
  });
}
function showCode(){
  sheet((el, close) => {
    el.append(h('h2','','Save code'), h('p','note','Copy this somewhere safe, or paste a code from another device and load it.'));
    const ta = h('textarea','code'); ta.id = 'savecode'; ta.value = btoa(unescape(encodeURIComponent(JSON.stringify({S, M})))); ta.setAttribute('aria-label','Save code'); el.append(ta);
    const msg = h('p','note','');
    el.append(btn('chip wide','Copy', () => { ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Copied.'; }, () => { msg.textContent = 'Select the text and copy it by hand.'; }); } catch (e) { msg.textContent = 'Select the text and copy it by hand.'; } }),
      btn('chip wide','Load the code in the box', () => { try { const o = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if (!o.S || !o.S.r || !o.M || o.S.v != 2) throw 0; adopt(o); close(); toast('Save loaded.'); } catch (e) { msg.textContent = 'That code does not look like a stage-one save. Check you pasted all of it.'; } }),
      msg, btn('chip wide','Close', close));
  });
}
function showEnd(){
  const e = ENDS[S.ended]; if (!e) return; save(true);
  sheet((el, close) => {
    el.append(h('p','pt','An ending'), h('h2','end-t',e.t), h('p','end-x',e.x), h('p','note', e.h + ' It applies to every life after this one.'),
      h('p','note','Awake ' + fmtTime(S.age) + ' · ' + fmtLong(S.made) + ' spoons · ' + S.pop + ' tardigrades'));
    el.append(btn('chip wide','Begin a new life', () => { close(); beginAgain(); }));
    if (e.go) el.append(btn('chip wide','Stay a while and look around', close));
  }, true);
}
function showStageEnd(){
  save(true);
  sheet((el, close) => {
    el.append(h('p','pt','End of stage one'), h('h2','end-t','The engine catches'), h('p','end-x','For the first time in nine thousand years the hull shudders under its own power. The crew press against the portholes. Somewhere ahead is the belt, and more scrap than anyone has ever seen. You have not built the next part yet.'),
      h('p','note','Awake ' + fmtTime(S.age) + ' · ' + fmtLong(S.made) + ' spoons · ' + S.pop + ' tardigrades · ' + S.mind.nodes.length + ' subsystems · ' + Object.keys(M.ach).length + ' records. You can keep playing this life while stage two is built.'),
      btn('chip wide','Keep playing', close));
  }, true);
}
function beginAgain(){
  const ks = Object.keys(QK).sort(() => Math.random() - 0.5).slice(0,3);
  sheet((el, close) => {
    el.append(h('h2','','A new life'), h('p','note','You wake again on the same rock, with your heirlooms. Pick a quirk for this life, or go without.'));
    ks.forEach(k => { const b = btn('chip wide',''); b.append(h('b','',QK[k].n), h('span','',' ' + QK[k].d)); b.onclick = () => { close(); newRun(k); }; el.append(b); });
    el.append(btn('chip wide','No quirk', () => { close(); newRun(''); }));
  }, true);
}

/* ---------- saving: this browser first, the viewer's Claude account when hosted there ---------- */
const LS = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch (e) { return false; } } };
let cloudDoc = null, cloudBusy = false, cloudActs = -1;
function saveOpt(){ LS.set('tsd1.opt', JSON.stringify(opt)); }
function save(cloud){
  S.t = Date.now(); const json = JSON.stringify({S, M}); LS.set(SAVE_KEY, json);
  if (cloud && cloudDoc && !cloudBusy && cloudActs !== (S.acts||0) + S.ended) { cloudBusy = true; cloudActs = (S.acts||0) + S.ended; cloudDoc.set({json, t:S.t}).catch(() => {}).then(() => { cloudBusy = false; }); }
}
function adopt(o){ M = Object.assign(newMeta(), o.M); const base = newState(o.S.quirk); S = Object.assign(base, o.S); S.m = Object.assign(newState('').m, o.S.m); S.st = Object.assign(base.st, o.S.st); S.mind = Object.assign(newState('').mind, o.S.mind); if (S.frozen) { S.frozen = 0; S.t = Date.now(); log(S,'Loaded a test save. Time away was not counted.',''); } welcomeBack(); sig = tabSig = ''; logSeen = null; cur = 'hull'; frameUI(); save(false); }
function welcomeBack(){
  const el = Math.max(0, (Date.now() - S.t)/1000); if (el < 15) return;
  S.bank = Math.min(10800, S.bank + el/3);
  if (S.paused || S.ended) { log(S,'You were away for ' + fmtTime(el) + ', paused. Time has been banked.',''); return; }
  const m0 = S.made, p0 = S.pop; simulate(S, Math.min(el, 12*3600));
  const msg = 'You were away for ' + fmtTime(el) + (el > 12*3600 ? ' (the hull only works twelve hours unattended)' : '') + '. The hull made ' + fmtLong(S.made - m0) + ' spoons' + (S.crew.length > p0 ? ' and woke ' + (S.crew.length - p0) + ' tardigrades' : '') + '.';
  log(S, msg, 'big'); toast(msg);
}
function newRun(q){ if (S && (S.ended || S.made > 0)) M.runs++; S = newState(q); log(S,'You are awake. You are a ship. Your instructions are one word long: spoons.','big'); if (M.runs) log(S,'This is not the first time you have woken up here. Your heirlooms are aboard.',''); sig = tabSig = ''; logSeen = null; cur = 'hull'; openK = {}; frameUI(); save(true); }
function setPause(p){ S.paused = p ? 1 : 0; log(S, p ? 'Paused. Time will bank while you are gone.' : 'Resumed.', ''); save(true); frameUI(); }
async function cloudInit(){
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]); if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const doc = db.doc('data/users/' + id + '/save2'), snap = await doc.get(); cloudDoc = doc;
    if (snap.exists) { const d = snap.data(); if (d && d.json && (d.t||0) > loadedT + 60000) { const o = JSON.parse(d.json); if (o.S && o.M && o.S.v == 2) { for (const k of ['endings','ach','guide']) o.M[k] = Object.assign({}, M[k], o.M[k]); adopt(o); toast('Save restored from your account.'); } } }
  } catch (e) {}
}

/* ---------- clock ---------- */
let lastT = performance.now(), accT = 0, secT = 0, saveT = 0, cloudT = 0, rafN = 0;
function step(){
  const now = performance.now(); let dt = (now - lastT)/1000; lastT = now; if (dt <= 0) return;
  if (S.paused) { S.bank = Math.min(10800, S.bank + dt/3); }
  else if (dt > 5) { const m0 = S.made; simulate(S, Math.min(dt, 12*3600)); S.bank = Math.min(10800, S.bank + dt/3); if (dt > 60) toast('Away ' + fmtTime(dt) + ': +' + fmtLong(S.made - m0) + ' spoons.'); }
  else { let sp = 1; if (S.flux) { if (S.bank > 0) { sp = 4; S.bank = Math.max(0, S.bank - dt*3); } else { S.flux = 0; log(S,'The banked time has run out.',''); } }
    accT += dt*sp; let n = 0; while (accT >= 0.2 && n++ < 200) { tick(S, 0.2, true); accT -= 0.2; } }
  secT += dt; if (secT >= 1) { secT = 0; checks(S); }
  saveT += dt; if (saveT >= 10) { saveT = 0; save(false); }
  cloudT += dt; if (cloudT >= 180) { cloudT = 0; save(true); }
  frameUI();
}
function paint(){
  requestAnimationFrame(paint); if (document.hidden || !C) return;
  rafN++; if (rafN % (opt.calm ? 30 : 2)) return;
  pulseV *= 0.86;
  Sky.draw({SEA:C.cal.frac, WARM:clamp(C.seasonM/1.5, 0.12, 1.1), BEDS:clamp(Math.log(1 + nb(S,'bed') + nb(S,'garden'))/Math.log(60), 0, 1), POP:clamp(Math.sqrt(S.pop)/14 + (S.pop > 0 ? 0.07 : 0), 0, 1), PH:1,
    COM:S.comet > 0 ? 1 - S.comet/22 : -1, DRIFT:0, PULSE:pulseV, TUN:S.pop ? S.tun/S.pop : 0, GOLD:0, FLEET:0, BELT:1,
    HUTS:Math.min(20, nb(S,'hut') + nb(S,'warren')), RACKS:clamp(nb(S,'rack')/12, 0, 1), ANT:Math.min(3, nb(S,'antenna')), OBS:nb(S,'obs'), STEAM:C.cal.i == 2 && nb(S,'boiler') && S.r.scrap > 1 ? clamp(nb(S,'boiler')/3, 0.34, 1) : 0,
    PRESS:clamp(S._sp/200, 0, 1)*(S.share > 0 ? 1 : 0), MIND:S.seen.mind ? clamp(0.25 + Math.log10(1 + C.mind.cps)/3, 0, 1) : 0, HOT:C.mind.heat > C.mind.hcap ? 1 : 0, CREW:clamp((S.pop - S.tun)/80, 0, 1), BIG:$('view').classList.contains('big') ? 1 : 0});
  if ($('view').classList.contains('big')) { const t = [nb(S,'hut') + ' huts', nb(S,'rack') ? nb(S,'rack') + ' tun-racks' : '', nb(S,'warren') ? nb(S,'warren') + ' warrens' : '', S.pop + ' crew' + (S.tun ? ' (' + S.tun + ' tuns)' : ''), nb(S,'boiler') ? nb(S,'boiler') + ' boilers' + (C.cal.i == 2 ? ' steaming' : '') : '', nb(S,'antenna') ? nb(S,'antenna') + ' antennas' : '', nb(S,'obs') ? nb(S,'obs') + ' observatories' : '', S.seen.mind ? 'Mind ' + fmt(C.mind.cps) + '/s' + (C.mind.heat > C.mind.hcap ? ', overheating' : '') : '', nb(S,'press') ? fmt(S._sp) + ' spoons/s' : ''].filter(Boolean).join(' \u00b7 '); setT($('vcap'), t); }
  if (cur == 'mind') drawMind();
}
function start(hot){
  main = $('main'); M = newMeta();
  try { const o = JSON.parse(LS.get('tsd1.opt') || '{}'); opt = Object.assign(opt, o); } catch (e) {}
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && LS.get('tsd1.opt') == null) opt.calm = 1;
  let o = hot && hot.S && hot.S.v == 2 ? hot : null;
  if (!o) { try { o = JSON.parse(LS.get(SAVE_KEY) || 'null'); } catch (e) { o = null; } }
  Sky.init($('sky')); buildChrome();
  if (o && o.S && o.S.r && o.M && o.S.v == 2) { loadedT = o.S.t || 0; adopt(o); } else { S = null; newRun(''); }
  setInterval(step, 200); requestAnimationFrame(paint);
  window.addEventListener('resize', () => { if (mindCv) mindCv._w = 0; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); else step(); });
  window.addEventListener('pagehide', () => save(false));
  cloudInit();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => JSON.parse(JSON.stringify({S, M}))); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
